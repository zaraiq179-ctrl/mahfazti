name: Build APK and web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bundle fonts for offline use
        run: node scripts/fonts.mjs
      - name: App icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          for n in 180 192 512; do rsvg-convert -w $n -h $n assets/icon.svg -o www/icon-$n.png; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Bundle fonts for offline use
        run: node scripts/fonts.mjs
      - name: Bundle Capacitor runtime for plain HTML
        run: |
          mkdir -p www/cap
          cp node_modules/@capacitor/core/dist/capacitor.js www/cap/capacitor.js
          cp node_modules/@capacitor/local-notifications/dist/plugin.js www/cap/ln.js
          cp node_modules/@capacitor/haptics/dist/plugin.js www/cap/haptics.js
          sed -i 's#</head>#<script src="cap/capacitor.js"></script><script src="cap/ln.js"></script><script src="cap/haptics.js"></script>\n</head>#' www/index.html
          grep -c 'cap/ln.js' www/index.html
      - name: App icon
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin && rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon-only.png
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#1463FF' --iconBackgroundColorDark '#1463FF'
      - run: npx cap sync android
      - name: Use a fixed signing key so updates install over the old app
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk mahfazti.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: محفظتي v${{ github.run_number }}
          files: mahfazti.apk
