name: Build APK and web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bundle fonts for offline use
        run: node scripts/fonts.mjs
      - name: App icons
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          for n in 180 192 512; do rsvg-convert -w $n -h $n assets/icon.svg -o www/icon-$n.png; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4

  android:
    # content edits from the Al-Basheer control panel only touch the website, not the app
    if: ${{ !startsWith(github.event.head_commit.message, 'Admin:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Bundle fonts for offline use
        run: node scripts/fonts.mjs
      - name: Keep only the app in the APK (other sites stay on the web)
        run: rm -rf www/albasheer
      - name: Bundle Capacitor runtime for plain HTML
        run: |
          mkdir -p www/cap
          cp node_modules/@capacitor/core/dist/capacitor.js www/cap/capacitor.js
          cp node_modules/@capacitor/local-notifications/dist/plugin.js www/cap/ln.js
          cp node_modules/@capacitor/haptics/dist/plugin.js www/cap/haptics.js
          cp node_modules/@capacitor/background-runner/dist/plugin.js www/cap/br.js
          sed -i 's#</head>#<script src="cap/capacitor.js"></script><script src="cap/ln.js"></script><script src="cap/haptics.js"></script><script src="cap/br.js"></script>\n</head>#' www/index.html
          grep -c 'cap/ln.js' www/index.html
      - name: App icon
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin && rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon-only.png
      - run: npx cap add android
      - name: Notification permissions (exact alarms, boot, post)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for perm in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED WAKE_LOCK VIBRATE; do
            grep -q "android.permission.$perm\"" $M || sed -i "s#</manifest>#    <uses-permission android:name=\"android.permission.$perm\" />\n</manifest>#" $M
          done
          cat $M | grep uses-permission
      - name: Harden the app (no cloud backup of stored keys, HTTPS only)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:allowBackup="true"#android:allowBackup="false" android:usesCleartextTraffic="false"#' $M
          grep -o 'android:allowBackup="false"' $M
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#1463FF' --iconBackgroundColorDark '#1463FF'
      - run: npx cap sync android
      - name: Background runner engine (price alerts while the app is closed)
        run: |
          G=android/app/build.gradle
          sed -i "s#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'#&\n        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'#" $G
          grep -c "background-runner/android/src/main/libs" $G
      - name: New version number every build so Android installs it as an update
        run: |
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName" $G
      - name: Sign every build with the same key from the repo so updates install over the old app
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  fixed {
                      storeFile file("${rootDir}/../keystore/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fixed }
              }
          }
          GRADLE
          tail -16 android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk mahfazti.apk
      - name: Check the APK is signed with the repo key
        run: |
          WANT=$(keytool -list -v -keystore keystore/debug.keystore -storepass android | grep -m1 "SHA256:" | awk '{print $2}')
          GOT=$($ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/apksigner verify --print-certs mahfazti.apk | grep -m1 "SHA-256" | awk '{print $NF}' | tr a-z A-Z | sed 's/../&:/g;s/:$//')
          echo "want $WANT"; echo "got  $GOT"; [ "$WANT" = "$GOT" ]
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: محفظتي v${{ github.run_number }}
          files: mahfazti.apk
