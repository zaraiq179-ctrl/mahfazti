<style>
/* VOICE: quiet, precise, a native-feeling iOS / One UI money app. Numbers lead, chrome recedes.
   IDEA: an activity ring for money: the month's spendable cash drains like a ring closing.
   PICTURE: gradient ring on a white card, live count-up numbers, glass tab bar with sliding pill.
   COLOUR and TYPE: system grays #f2f2f7/#000, blue #0a84ff accent, green for saving, orange/red only to warn. Readex Pro + IBM Plex Sans Arabic.
   LAYOUT: one phone column, large titles that collapse into a blurred nav, floating glass dock, spring bottom sheet with keypad. */
:root{color-scheme:light dark;
--bg:light-dark(#f2f2f7,#000);--card:light-dark(#fff,#1c1c1e);--card2:light-dark(#f2f2f7,#2c2c2e);
--ink:light-dark(#000,#fff);--ink2:light-dark(rgba(60,60,67,.6),rgba(235,235,245,.6));--ink3:light-dark(rgba(60,60,67,.3),rgba(235,235,245,.3));
--sep:light-dark(rgba(60,60,67,.12),rgba(84,84,88,.45));
--blue:light-dark(#007aff,#0a84ff);--green:light-dark(#34c759,#30d158);--orange:light-dark(#ff9500,#ff9f0a);--red:light-dark(#ff3b30,#ff453a);--indigo:light-dark(#5856d6,#5e5ce6);--teal:light-dark(#30b0c7,#40c8e0);
--glass:light-dark(rgba(255,255,255,.72),rgba(30,30,32,.72));--glassedge:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.08));
--shadow:light-dark(0 1px 2px rgba(0,0,0,.04),0 0 0 transparent);
--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.2,.9,.25,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 "IBM Plex Sans Arabic","Inter","IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
h1,h2,h3,b,.num,.t{font-family:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif}
.num{font-feature-settings:"tnum" 1,"cv11" 1;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
/* nav */
.nav{position:sticky;top:0;z-index:20;margin:0 -16px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;text-align:center;transition:background .25s,backdrop-filter .25s,box-shadow .25s}
.nav .t{font-size:17px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .3s var(--out)}
.nav.sc{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 .5px 0 var(--sep)}
.nav.sc .t{opacity:1;transform:none}
.lt{padding:2px 4px 14px}
.lt h1{font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.lt p{margin:2px 0 0;color:var(--ink2);font-size:15px}
/* cards */
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.sec{font-size:13px;color:var(--ink2);margin:22px 8px 7px;display:flex;justify-content:space-between}
.enter .lt,.enter .card,.enter .sec,.enter .tiles>*{animation:rise .55s var(--out) both;animation-delay:calc(var(--i,0)*38ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}}
/* press feedback */
.press{transition:transform .5s var(--spring),opacity .2s}
.press.down{transform:scale(.955);transition:transform .09s ease-out}
.press.down.soft{transform:scale(.985)}
/* hero */
.hero{padding:22px 18px 18px;text-align:center}
.ring{position:relative;width:min(232px,62vw);aspect-ratio:1;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;gap:2px}
.ring small{font-size:14px;color:var(--ink2)}
.ring b{font-size:clamp(32px,9.5vw,42px);font-weight:700;line-height:1.05;letter-spacing:-.02em}
.ring em{font-style:normal;font-size:13px;color:var(--ink2)}
.duo{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border-top:.5px solid var(--sep);padding-top:14px}
.duo.tri{grid-template-columns:repeat(3,minmax(0,1fr))}
.duo.tri b{font-size:17px}
.duo div+div{border-inline-start:.5px solid var(--sep)}
.duo small{display:block;font-size:13px;color:var(--ink2)}
.duo b{font-size:20px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;border-top:.5px solid var(--sep);padding-top:14px}
.stats div+div{border-inline-start:.5px solid var(--sep)}
.stats small{display:block;font-size:12.5px;color:var(--ink2)}
.stats b{font-size:19px;font-weight:600}
/* alerts */
.al{display:flex;gap:12px;align-items:center;padding:14px 16px}
.al .ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-content:center;color:#fff;font:700 17px "Inter","IBM Plex Sans Arabic",system-ui,sans-serif}
.al p{margin:0;font-size:15px;line-height:1.5}
.al.red .ic{background:var(--red)}.al.or .ic{background:var(--orange)}.al.blue .ic{background:var(--blue)}
/* rows */
.list{padding:4px 0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative;background:var(--card)}
.row+.row::before,.sw+.sw .row::before{content:"";position:absolute;top:0;inset-inline:62px 0;border-top:.5px solid var(--sep)}
.row .grow{flex:1}
.row .s{font-size:13px;color:var(--ink2)}
.amtR{font-weight:600;font-size:17px}
.ci{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-content:center;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ci svg,.cat svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw{position:relative;overflow:hidden;touch-action:pan-y}
.sw .del{visibility:hidden;position:absolute;inset:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-inline-start:24px;font-weight:600;font-size:15px}
.sw .row{will-change:transform}
.sw.on .del{visibility:visible}
.hint{font-size:12.5px;color:var(--ink3);text-align:center;padding:4px 0 10px}
.empty{text-align:center;color:var(--ink2);padding:26px 16px;font-size:15px}
.empty svg{width:44px;height:44px;stroke:var(--ink3);fill:none;stroke-width:1.6;display:block;margin:0 auto 8px}
/* check */
.ck{width:28px;height:28px;border-radius:50%;flex:none;border:2px solid var(--ink3);display:grid;place-content:center;transition:background .25s,border-color .25s}
.ck svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ck path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s var(--out) .05s}
.ck.on{background:var(--green);border-color:var(--green);animation:pop .45s var(--spring)}
.ck.on path{stroke-dashoffset:0}
@keyframes pop{40%{transform:scale(1.18)}}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.tile{background:var(--card);border-radius:22px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:150px}
.tile .ti{width:34px;height:34px;border-radius:10px;display:grid;place-content:center;color:#fff;margin-bottom:8px}
.tile .ti svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile small{color:var(--ink2);font-size:13px}
.tile b{font-size:22px;font-weight:700;letter-spacing:-.01em}
.tile .sub{font-size:13px;color:var(--ink2);margin-top:auto}
.pill{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;white-space:nowrap;border-radius:14px;padding:0 10px;min-height:40px;font-weight:600;font-size:14px;margin-top:10px}
.pill svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pill.done{background:var(--card2);color:var(--ink2)}
.pill.g{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green)}
.bar{height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin:10px 0 4px}
.bar>i{display:block;height:100%;width:0;border-radius:5px;background:var(--c,var(--blue));transition:width 1s var(--out)}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0;font-size:16px}
.kv span{color:var(--ink2)}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
/* month switch */
.ms{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px}
.ms b{font-size:17px;font-weight:600}
.cb{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-content:center;font-size:22px;color:var(--blue)}
.cb:disabled{color:var(--ink3)}
/* invest hero */
.ih{background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff}
.ih span,.ih small{color:rgba(255,255,255,.8)}
.ih .bar{background:rgba(255,255,255,.25)}.ih .bar>i{background:#fff}
.sym{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-content:center;font:700 11px "Inter","IBM Plex Sans Arabic",system-ui,sans-serif;color:#fff;letter-spacing:.02em}
/* forms */
.fr{display:flex;align-items:center;gap:10px;padding:12px 16px;position:relative;min-height:52px}
.fr+.fr::before{content:"";position:absolute;top:0;inset-inline:16px 0;border-top:.5px solid var(--sep)}
.fr>span{flex:1;white-space:nowrap}
.fin{border:0;background:none;text-align:left;width:46%;font-size:17px;color:var(--ink2);padding:6px 0;direction:ltr;outline:none}
.fin.nm{text-align:right;direction:rtl;color:var(--ink);width:auto;flex:1}
.fin:focus{color:var(--blue)}
.fr em{font-style:normal;color:var(--ink3);font-size:14px}
.minus{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-content:center;flex:none;font:700 18px/1 sans-serif}
.link{color:var(--blue);font-weight:500;padding:14px 16px;width:100%;text-align:start}
.foot{font-size:13px;color:var(--ink2);margin:7px 16px 0;line-height:1.5}
.cta{width:100%;min-height:54px;border-radius:16px;background:var(--blue);color:#fff;font:600 17px "Inter","IBM Plex Sans Arabic",system-ui,sans-serif}
.cta.g{background:var(--green)}
input.box{width:100%;min-height:48px;border-radius:12px;border:0;background:var(--card2);padding:0 14px;font-size:17px;direction:ltr;text-align:left;outline:none}
input.box:focus{box-shadow:0 0 0 2px var(--blue)}
/* onboarding */
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto}
.onb[hidden]{display:none}
.onbin{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 22px)}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:26px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--ink3);transition:width .4s var(--spring),background .3s}
.dots i.on{width:22px;background:var(--blue)}
.ostep{flex:1;display:flex;flex-direction:column}
.ostep h2{font-size:30px;line-height:1.15;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
.ostep p.lead{color:var(--ink2);margin:0 0 26px;font-size:16px}
.bigin{width:100%;border:0;background:var(--card);border-radius:20px;height:76px;text-align:center;font:700 36px "Inter","IBM Plex Sans Arabic",system-ui,sans-serif;direction:ltr;outline:none;color:var(--ink)}
.bigin:focus{box-shadow:0 0 0 2px var(--blue)}
.ounit{text-align:center;color:var(--ink2);font-size:14px;margin:8px 0 18px}
.ofield{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:10px;min-height:58px}
.ofield span{font-size:16px}
.ofield input,.ofield select{border:0;background:var(--card2);border-radius:11px;height:40px;padding:0 12px;font:500 16px "Inter","IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);text-align:left;direction:ltr;width:46%;outline:none}
.ofield input.nm{direction:rtl;text-align:right;background:none;padding:0;width:auto;flex:1;font-family:inherit}
.chips2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 16px}
.chips2 button{border-radius:999px;background:var(--card);padding:0 16px;height:40px;font-size:15px;font-weight:500}
.chips2 button.on{background:var(--blue);color:#fff}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tog button{height:56px;border-radius:16px;background:var(--card);font-size:17px;font-weight:600}
.tog button.on{background:var(--blue);color:#fff}
.onav{display:flex;gap:10px;margin-top:22px}
.onav .cta{flex:1}
.onav .back{flex:none;width:56px;min-height:54px;border-radius:16px;background:var(--card);font-size:22px;color:var(--ink2)}
.hero-ic{width:96px;height:96px;border-radius:24px;margin:30px auto 26px;display:block;box-shadow:0 16px 40px rgba(20,99,255,.35)}
/* loan */
.loanc .lh{display:flex;gap:12px;align-items:flex-start}
.loanc .lh b{font-size:16px}
.loanc .s{font-size:13.5px;color:var(--ink2);line-height:1.5;margin-top:2px}
.lrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;border-top:.5px solid var(--sep);padding-top:12px;text-align:center}
.lrow div+div{border-inline-start:.5px solid var(--sep)}
.lrow small{display:block;font-size:12px;color:var(--ink2)}
.lrow b{font-size:17px;font-weight:600}
/* settings */
.adv{margin-top:18px}
.adv>summary{list-style:none;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:12px 14px;cursor:pointer}
.adv>summary::-webkit-details-marker{display:none}
.adv .chev{font-size:22px;color:var(--ink3);transition:transform .35s var(--spring)}
.adv[open] .chev{transform:rotate(-90deg)}
.adv[open]>summary{margin-bottom:4px}
.sumc small{color:var(--ink2);font-size:14px}
.stack{display:flex;gap:3px;height:12px;border-radius:7px;overflow:hidden;margin:14px 0 12px}
.stack i{display:block;min-width:4px;transition:flex .6s var(--out)}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.legend div{display:grid;gap:1px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend span{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.legend b{font-size:15px;font-weight:600}
.grp{padding:0;overflow:hidden}
.sr{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:58px;position:relative;width:100%;text-align:start}
.sr+.sr::before{content:"";position:absolute;top:0;inset-inline:58px 0;border-top:.5px solid var(--sep)}
.sic{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-content:center;background:var(--c);color:#fff}
.sic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.sl{flex:1;display:grid;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl small{font-size:12.5px;color:var(--ink2)}
.sv{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:11px;background:var(--card2);width:46%;flex:none;transition:box-shadow .2s}
.sv:focus-within{box-shadow:0 0 0 2px var(--blue)}
.sv input{flex:1;width:100%;border:0;background:none;outline:none;font:500 16px "Inter","IBM Plex Sans Arabic",system-ui,sans-serif;text-align:left;direction:ltr;color:var(--ink);padding:0}
.sv em{font-style:normal;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.sname{flex:1;border:0;background:none;outline:none;font-size:17px;padding:6px 0;color:var(--ink)}

.sym.sm{width:32px;height:32px;border-radius:9px;font-size:9.5px}
.addr{cursor:pointer}
/* dock */
.dock{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 28px));display:flex;gap:10px;z-index:30}
.tabbar{flex:1;position:relative;display:grid;grid-template-columns:repeat(4,1fr);height:64px;border-radius:32px;padding:4px;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(190%);backdrop-filter:blur(28px) saturate(190%);box-shadow:0 8px 32px rgba(0,0,0,.12),inset 0 0 0 .5px var(--glassedge)}
.tabbar .ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:28px;background:light-dark(rgba(0,0,0,.06),rgba(255,255,255,.12))}
.tabbar button{position:relative;display:grid;justify-items:center;align-content:center;gap:1px;font-size:11px;font-weight:500;color:var(--ink2);border-radius:28px;transition:color .2s}
.tabbar button.on{color:var(--blue)}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab{flex:none;width:64px;height:64px;border-radius:50%;background:linear-gradient(160deg,#3aa0ff,#0a6cff);color:#fff;display:grid;place-content:center;box-shadow:0 10px 28px rgba(10,108,255,.4)}
.fab svg{width:28px;height:28px;stroke:#fff;stroke-width:2.6;stroke-linecap:round;fill:none}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;z-index:40}
.sheet{position:fixed;left:50%;bottom:0;width:min(520px,100%);transform:translate(-50%,110%);background:var(--card);border-radius:28px 28px 0 0;z-index:41;padding:6px 18px calc(16px + env(safe-area-inset-bottom));max-height:96vh;overflow-y:auto;overscroll-behavior:contain;visibility:hidden}
.grab{padding:8px 0 4px;display:grid;place-content:center;touch-action:none;cursor:grab}
.grab i{width:38px;height:5px;border-radius:3px;background:var(--ink3)}
.shh{display:flex;justify-content:space-between;align-items:center;touch-action:none;padding-bottom:2px}
.shh b{font-size:17px;font-weight:600}
.tb{color:var(--blue);font-size:17px;padding:8px 4px;min-width:52px}
.tb.s{font-weight:600;text-align:left}
.amtd{text-align:center;padding:10px 0 0}
.amtd .num{font:700 52px/1.1 "Inter","IBM Plex Sans Arabic",system-ui,sans-serif;letter-spacing:-.03em;display:inline-block}
.amtd .num.zero{color:var(--ink3)}
.amtd small{display:block;color:var(--ink2);font-size:14px}
.bump{animation:bump .28s var(--spring)}
@keyframes bump{40%{transform:scale(1.06)}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.warn{min-height:22px;text-align:center;font-size:14px;color:var(--ink2);margin:2px 0 10px;transition:color .2s}
.warn.o{color:var(--orange)}.warn.r{color:var(--red)}
.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hintc{text-align:center;font-size:13px;color:var(--ink2);margin:2px 0 8px}
.cat{display:flex;align-items:center;gap:8px;height:56px;border-radius:16px;padding:0 10px;background:color-mix(in srgb,var(--c) 13%,transparent);font-size:15px;font-weight:600;color:var(--ink)}
.cat i{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-content:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);transition:background .25s,color .25s,transform .45s var(--spring)}
.cat i svg{width:19px;height:19px}
.cat.go{background:var(--c);color:#fff}.cat.go i{background:rgba(255,255,255,.25);color:#fff}
.cat i{background:var(--c);color:#fff}
.opt[hidden]{display:none}
.opt{display:flex;gap:10px;margin:14px 0 10px;align-items:center}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card2);border-radius:10px;padding:2px;flex:none;width:170px}
.seg .th{position:absolute;top:2px;bottom:2px;width:calc(50% - 2px);right:2px;border-radius:8px;background:light-dark(#fff,#636366);box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .45s var(--spring)}
.seg.b1 .th{transform:translateX(-100%)}
.seg button{position:relative;height:34px;font-size:14px;font-weight:500}
.note{flex:1;height:38px;border:0;border-radius:10px;background:var(--card2);padding:0 12px;font-size:15px;outline:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;direction:ltr}
.pad button{height:54px;border-radius:14px;background:var(--card2);font:500 24px "Inter","IBM Plex Sans Arabic",system-ui,sans-serif}
.pad button.fn{font-size:18px;background:none}
/* island toast */
.island{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;z-index:60;transform:translate(-50%,-140%);background:#000;color:#fff;border-radius:24px;padding:12px 18px;display:flex;align-items:center;gap:12px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(92vw,440px)}
.island .dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
.island.o .dot{background:#ff9f0a}.island.r .dot{background:#ff453a}
.island button{color:#0a84ff;font-weight:600;flex:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-reduced-transparency:reduce){.nav.sc,.tabbar{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}}
</style>
</head>
<body>
<div class="app">
  <header class="nav" id="nav"><div class="t" id="navt">محفظتي</div></header>
  <main id="view"></main>
</div>

<div class="dock">
  <button class="fab press" id="fab" aria-label="أضف مصروف"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav class="tabbar" id="tabbar"><i class="ind" id="ind"></i>
    <button data-tab="home" class="press on"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 4l8.5 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6H9v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>الرئيسية</button>
    <button data-tab="exp" class="press"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>الشهر</button>
    <button data-tab="inv" class="press"><svg viewBox="0 0 24 24"><path d="M3.5 17.5 9 12l4 4 7.5-7.5M15 8.5h5.5V14"/></svg>الاستثمار</button>
    <button data-tab="set" class="press"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>الإعدادات</button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-label="مصروف جديد">
  <div class="grab" id="grab"><i></i></div>
  <div class="shh" id="shh"><button class="tb press" data-act="close">إلغاء</button><b>صرفت شكد؟</b><button class="tb s press" data-act="more" id="moreBtn">المزيد</button></div>
  <div class="amtd"><span id="amtv" class="num zero">0</span><small>دينار</small></div>
  <div class="warn" id="aWarn"></div>
  <div class="opt" id="opt" hidden><div class="seg" id="seg"><i class="th"></i><button data-day="0">اليوم</button><button data-day="1">البارحة</button></div><input class="note" id="aNote" placeholder="ملاحظة" maxlength="60"></div>
  <div class="pad" id="pad"></div>
  <div class="hintc">اكتب المبلغ، وبعدين اضغط على شنو صرفته</div>
  <div class="cats" id="cats"></div>
</section>
<div class="onb" id="onb" hidden><div class="onbin" id="onbin"></div></div>
<div class="island" id="island"><i class="dot"></i><span id="imsg"></span><button id="iundo" hidden>تراجع</button></div>

<script>
{
const MONTHS=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
const IC={
 food:'<path d="M7 3v7M5 3v4.5a2 2 0 0 0 4 0V3M7 10v11M16.5 3C14.5 3 13.5 6 13.5 9.5c0 2 1 3 3 3V21"/>',
 fuel:'<path d="M5 21V5.5A2.5 2.5 0 0 1 7.5 3h4A2.5 2.5 0 0 1 14 5.5V21M3.5 21h12M5 10h9M14 8.5h1.5a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
 out:'<path d="M4.5 9h11v4.5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM15.5 10.5h1.5a2.5 2.5 0 0 1 0 5h-1.5M8 3v3M12 3v3"/>',
 shop:'<path d="M5 8h14l-1.2 12H6.2zM9 8V6.5a3 3 0 0 1 6 0V8"/>',
 bills:'<path d="M13 2.5 4.5 14H11l-1 7.5L18.5 10H12z"/>',
 health:'<path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.3a4.2 4.2 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20z"/>',
 gift:'<path d="M4 11h16v9.5H4zM3 7.5h18V11H3zM12 7.5v13M12 7.5C10 3.5 6 4.5 7.5 7.5M12 7.5c2-4 6-3 4.5 0"/>',
 trip:'<path d="M10.5 13.5 3 11l1.5-1.5 7 1 4.5-5c1-1 2.8-1.5 3.3-1s0 2.3-1 3.3l-5 4.5 1 7L17.8 21l-2.5-7.5-3.5 3.5V20l-1.5 1.5-1.5-3-3-1.5L7.3 15.5h3z"/>',
 other:'<path d="M6 12h.01M12 12h.01M18 12h.01" stroke-width="3.2"/>'};
const CATS=[{k:"food",n:"أكل",c:"#ff9500",pick:1},{k:"fuel",n:"مواصلات",c:"#0a84ff",pick:1},{k:"out",n:"طلعات",c:"#af52de",pick:1},{k:"shop",n:"تسوق",c:"#ff2d55",pick:1},{k:"bills",n:"فواتير",c:"#30b0c7"},{k:"health",n:"صحة",c:"#ff3b30"},{k:"gift",n:"هدايا",c:"#5856d6"},{k:"trip",n:"سفر",c:"#00a3a3",pick:1},{k:"other",n:"أخرى",c:"#8e8e93",pick:1}];
const SYMC=["#f5b300","#00a4ef","#34a853","#ff9900","#e60012","#0668e1","#cc0000","#8e8e93"];
const SCOL={SPUS:"#0a7f5a",PAXG:"#d4a017",TSM:"#e60012",TSMC:"#e60012",MSFTB:"#00a4ef",GOOGLB:"#34a853",AMZNB:"#ff9900",METAB:"#0668e1",TSLAB:"#cc0000"};
const symCol=(sym,i)=>SCOL[sym]||SYMC[i%SYMC.length];
const T3=100/3;
const DEF={salary:1000000,rate:1500,split:{p:T3,o:T3,i:T3},payday:1,remind:"21:00",
  sav:{monthly:0,goal:0,name:"صندوق الطوارئ"},
  loan:{n:"القسط",a:0,start:"",end:"",payout:0,emerg:0,travel:0,spread:4},
  obl:[{id:"car",n:"السيارة",a:0},{id:"home",n:"البيت",a:0}],
  assets:[{s:"SPUS",n:"S&P 500 الشرعي",p:70,w:"قسم الأسهم"},{s:"PAXG",n:"ذهب",p:20,w:"Spot"},{s:"TSM",n:"TSMC",p:10,w:"قسم الأسهم"}]};
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=n=>Math.round(+n||0).toLocaleString("en-US");
const usd=n=>"$"+(+n||0).toFixed(2);
const pc=n=>Math.round(n*100)+"%";
const digits=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
const num=s=>+(digits(s).replace(/[^\d.]/g,""))||0;
const $=s=>document.querySelector(s);
const mk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const mlabel=k=>{const[y,m]=k.split("-");return MONTHS[+m-1]+" "+y};
const catOf=k=>CATS.find(c=>c.k===k)||CATS[CATS.length-1];
const svg=(p,cls="")=>`<svg viewBox="0 0 24 24" class="${cls}">${p}</svg>`;

/* ---------- spring engine (Apple-style: damping ratio + response) ---------- */
function spring({from,to,velocity=0,response=.4,damping=1,eps=.01,onUpdate,onDone}){
  if(RM){onUpdate(to);onDone&&onDone();return{stop(){}}}
  const w=2*Math.PI/response,k=w*w,c=2*damping*w;let x=from-to,v=velocity,last=performance.now(),id,dead=false;
  const step=t=>{if(dead)return;let dt=Math.min(.05,(t-last)/1000);last=t;const n=Math.max(1,Math.ceil(dt/.004)),h=dt/n;
    for(let i=0;i<n;i++){const a=-k*x-c*v;v+=a*h;x+=v*h}
    if(Math.abs(x)<eps&&Math.abs(v)<eps*10){onUpdate(to);onDone&&onDone();return}
    onUpdate(to+x);id=requestAnimationFrame(step)};
  id=requestAnimationFrame(step);return{stop(){dead=true;cancelAnimationFrame(id)},vel:()=>v};
}
const project=(v,d=.998)=>(v/1000)*d/(1-d);
function hap(kind){
  const H=(window.capacitorHaptics&&window.capacitorHaptics.Haptics)||(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics);
  try{if(H){kind==="ok"?H.notification({type:"SUCCESS"}):kind==="warn"?H.notification({type:"WARNING"}):H.impact({style:kind==="mid"?"MEDIUM":"LIGHT"});return}
    if(navigator.vibrate)navigator.vibrate(kind==="warn"?[18,50,18]:kind==="ok"?[10,30,14]:6)}catch(e){}
}

/* ---------- state + storage ---------- */
let S={set:clone(DEF),months:{}};
let hadLocal=false;try{const l=JSON.parse(localStorage.getItem("mz1"));if(l&&l.set){hadLocal=true;S={set:{...clone(DEF),...l.set},months:l.months||{}};if(S.set.onboarded===undefined)S.set.onboarded=true}}catch(e){}
function migrate(){let ch=false;if(S.set.assetsV!==2){S.set.assets=clone(DEF.assets);S.set.assetsV=2;ch=true}
  if(!S.set.loanV){S.set.loan=S.set.loan||clone(DEF.loan);S.set.loanV=2;ch=true}
  if(S.set.loanV===1&&S.set.loan){if(S.set.loan.travel===undefined)S.set.loan.travel=0;S.set.loanV=2;ch=true}
  return ch}
if(migrate()){try{localStorage.setItem("mz1",JSON.stringify(S))}catch(e){}}
function M(k){const m=S.months[k]||(S.months[k]={});m.exp=m.exp||[];m.paid=m.paid||{};m.bought=m.bought||{};if(m.inv===undefined)m.inv=null;return m}
let store={mode:"local"};const dirty=new Set();let timer=null,flushing=false;
function save(key){try{localStorage.setItem("mz1",JSON.stringify(S))}catch(e){}
  if(store.mode!=="db")return;dirty.add(key);clearTimeout(timer);timer=setTimeout(flush,600)}
async function flush(){
  if(flushing){timer=setTimeout(flush,600);return}
  flushing=true;const keys=[...dirty];dirty.clear();
  for(const k of keys){const id=k==="settings"?"settings":"m-"+k;const body=k==="settings"?{set:clone(S.set)}:clone(M(k));
    try{await store.db.collection(store.base).doc(id).set(body)}
    catch(e){if(e&&e.code==="unavailable")dirty.add(k);else if(e&&e.code==="quota_exceeded")toast("المساحة امتلأت، ما انحفظ آخر تعديل","r")}}
  flushing=false;if(dirty.size)timer=setTimeout(flush,2000);
}
async function initDb(){
  if(!window.claude||!window.claude.use)return;
  try{const[db,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id=u&&await u.id();if(!db||!id)return;const base="data/users/"+id;
    const snap=await db.collection(base).get();store={mode:"db",db,base};
    if(snap.empty){dirty.add("settings");Object.keys(S.months).forEach(k=>dirty.add(k));flush();return}
    snap.docs.forEach(d=>{const b=d.data();if(!b)return;
      if(d.id==="settings"&&b.set){S.set={...clone(DEF),...clone(b.set)};if(S.set.onboarded===undefined)S.set.onboarded=true;closeOnb()}else if(d.id.startsWith("m-"))S.months[d.id.slice(2)]=clone(b)});
    if(migrate())save("settings");
    try{localStorage.setItem("mz1",JSON.stringify(S))}catch(e){}
    render(false);scheduleNative();
  }catch(e){}
}

/* ---------- native notifications (Android build) ---------- */
const LN=()=>(window.capacitorLocalNotifications&&window.capacitorLocalNotifications.LocalNotifications)||(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications);
function notify(title,body){const ln=LN();if(ln)ln.schedule({notifications:[{id:1000+Math.floor(Math.random()*90000),title,body}]}).catch(()=>{});
  if(DK&&inApp&&DK.notification)DK.notification.show({body:title+": "+body}).catch(()=>{})}
function nextPay(){const p=Math.min(28,Math.max(1,+S.set.payday||1)),d=new Date();d.setHours(0,0,0,0);let n=new Date(d.getFullYear(),d.getMonth(),p);if(n<d)n=new Date(d.getFullYear(),d.getMonth()+1,p);return{date:n,days:Math.round((n-d)/864e5)}}
function scheduleNative(){const ln=LN();if(!ln)return;const[h,mi]=(S.set.remind||"21:00").split(":").map(Number);
  const pre=[];for(let i=0;i<12;i++){const n=new Date();const pd=Math.min(28,Math.max(1,+S.set.payday||1));const at=new Date(n.getFullYear(),n.getMonth()+i,pd-1,18,0);if(at>n)pre.push({id:100+i,title:"محفظتي",body:"راتبك المفروض باچر ينزل",schedule:{at,allowWhileIdle:true}})}
  ln.requestPermissions().then(()=>ln.cancel({notifications:[{id:1},{id:2},...Array.from({length:12},(_,i)=>({id:100+i}))]})).then(()=>ln.schedule({notifications:[...pre,
    {id:1,title:"محفظتي",body:"سجّلت مصاريف اليوم؟",schedule:{on:{hour:h,minute:mi},repeats:true,allowWhileIdle:true}},
    {id:2,title:"يوم الراتب",body:"وقت الاستثمار الشهري وحط فلوس الادخار",schedule:{on:{day:+S.set.payday||1,hour:10,minute:0},repeats:true,allowWhileIdle:true}}]})).catch(()=>{})}

const APPDIR=()=>DK.os.homedir().then(h=>h.replace(/[\\/]+$/,"")+"\\AppData\\Local\\Mizaniyati");
async function setupScheduler(){
  if(!inApp||!DK.childProcess)return false;
  const plat=await DK.os.platform().catch(()=>"");if(plat!=="win32"){deskNote="الإشعارات المجدولة مدعومة حالياً على ويندوز.";return false}
  const dir=await APPDIR();await DK.fs.mkdir(dir,{recursive:true}).catch(()=>{});
  const ps="\uFEFFparam([string]$k)\r\n$m=@{daily='سجّلت مصاريف اليوم؟ افتح محفظتي وسجّلها';payday='راتبك المفروض باچر ينزل. لا تنسى الاستثمار والادخار'}\r\n[Windows.UI.Notifications.ToastNotificationManager, Windows.UI.Notifications, ContentType = WindowsRuntime] > $null\r\n[Windows.Data.Xml.Dom.XmlDocument, Windows.Data.Xml.Dom.XmlDocument, ContentType = WindowsRuntime] > $null\r\n$x = New-Object Windows.Data.Xml.Dom.XmlDocument\r\n$x.LoadXml(\"<toast><visual><binding template='ToastGeneric'><text>محفظتي</text><text>$($m[$k])</text></binding></visual></toast>\")\r\n$t = [Windows.UI.Notifications.ToastNotification]::new($x)\r\n[Windows.UI.Notifications.ToastNotificationManager]::CreateToastNotifier('{1AC14E77-02E7-4E5D-B744-2EB1AE5198B7}\\WindowsPowerShell\\v1.0\\powershell.exe').Show($t)\r\n";
  await DK.fs.writeFile(dir+"\\notify.ps1",ps,"utf8");
  const vbs='CreateObject("WScript.Shell").Run "powershell.exe -NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File ""'+dir+'\\notify.ps1"" " & WScript.Arguments(0), 0, False\r\n';
  await DK.fs.writeFile(dir+"\\notify.vbs",vbs,"utf8");
  const tr=k=>`/TR "wscript.exe \\"${dir}\\notify.vbs\\" ${k}"`;
  const pd=Math.min(28,Math.max(1,+S.set.payday||1));
  const r1=await DK.childProcess.exec(`schtasks /Create /F /TN "Mizaniyati Daily" /SC DAILY /ST ${S.set.remind||"21:00"} ${tr("daily")}`,{timeout:20000});
  const r2=await DK.childProcess.exec(pd===1?`schtasks /Create /F /TN "Mizaniyati Payday" /SC MONTHLY /MO LASTDAY /M * /ST 18:00 ${tr("payday")}`:`schtasks /Create /F /TN "Mizaniyati Payday" /SC MONTHLY /D ${pd-1} /ST 18:00 ${tr("payday")}`,{timeout:20000});
  schedOK=r1.code===0&&r2.code===0;deskNote=schedOK?"":"ما قدرت أجدول الإشعارات: "+(r1.stderr||r2.stderr||"").slice(0,140);
  try{localStorage.setItem("mzSched",schedOK?"1":"")}catch(e){}
  return schedOK}
let schedT=null;function reSchedule(){if(!schedOK)return;clearTimeout(schedT);schedT=setTimeout(()=>setupScheduler().catch(()=>{}),1500)}

async function initDesktop(){
  if(!window.claude||!window.claude.use)return;let d=null;try{d=await window.claude.use("desktop")}catch(e){}if(!d)return;DK=d;

const addM=(k,n)=>{const[y,m]=k.split("-").map(Number);return mk(new Date(y,m-1+n,1))};
function loanInfo(k){const L=S.set.loan;if(!L||!+L.a||!L.start||!L.end)return null;
  const pay=addM(L.end,1),sp=Math.max(1,+L.spread||4);let left=0;for(let x=k<L.start?L.start:k;x<=L.end&&left<120;x=addM(x,1))left++;
  return{L,active:k>=L.start&&k<=L.end,pay,isPay:k===pay,extra:k>=pay&&k<=addM(pay,sp-1)?Math.max(0,(+L.payout||0)-(+L.emerg||0)-(+L.travel||0))/sp:0,left}}
function calc(k){
  const d=new Date(),cur=mk(d);k=k||cur;const m=M(k),s=S.set;
  const[y,mo]=k.split("-").map(Number);const dim=new Date(y,mo,0).getDate();const day=k===cur?d.getDate():(k<cur?dim:1);
  const oblSum0=s.obl.reduce((a,o)=>a+(+o.a||0),0),li=loanInfo(k);let Pfull,O,I;
  if(li&&li.active){O=oblSum0+(+li.L.a);I=0;Pfull=Math.max(0,s.salary-O)}
  else{Pfull=s.salary*s.split.p/100;O=s.salary*s.split.o/100;I=s.salary*s.split.i/100+(li?li.extra:0)}
  const sav=s.sav||DEF.sav,SV=li&&li.active?0:Math.min(Pfull,+sav.monthly||0),P=Pfull-SV;
  const savedTot=Object.values(S.months).reduce((a,x)=>a+(x&&+x.saved||0),0);
  const travelIn=Object.values(S.months).reduce((a,x)=>a+(x&&+x.travelIn||0),0),travelOut=Object.values(S.months).reduce((a,x)=>a+(x&&x.exp?x.exp.filter(e=>e.c==="trip").reduce((b,e)=>b+e.a,0):0),0);
  const td=d.toDateString();let spent=0,tod=0;m.exp.forEach(e=>{if(e.c==="trip")return;spent+=e.a;if(k===cur&&new Date(e.t).toDateString()===td)tod+=e.a});
  const allow=Math.max(0,(P-(spent-tod))/(dim-day+1));const oblSum=s.obl.reduce((a,o)=>a+(+o.a||0),0);
  return{k,cur,m,s,dim,day,P,Pfull,SV,sav,savedTot,travelIn,travel:travelIn-travelOut,O,I,li,spent,tod,allow,left:P-spent,oblSum,expected:P*day/dim};
}
function alerts(c){const a=[];
  if(c.spent>c.Pfull)a.push(["red","!","تجاوزت حصتك الشخصية كلها، وراح الادخار، بـ "+f(c.spent-c.Pfull)+" دينار"]);
  else if(c.spent>c.P)a.push(["red","!","دخلت على فلوس الادخار بـ "+f(c.spent-c.P)+" دينار"]);
  else if(c.spent>=.8*c.P)a.push(["or","!","صرفت "+pc(c.spent/c.P)+" من مصروف الشهر، باقي "+f(c.left)+" دينار"]);
  if(c.tod>c.allow)a.push(["or","!","صرفت اليوم أكثر من حدّك بـ "+f(c.tod-c.allow)+" دينار. خففها باچر"]);
  else if(c.spent<=c.P&&c.day>2&&c.spent>c.expected*1.15)a.push(["or","↗","صرفك أسرع من الخطة. المفروض لحد اليوم حوالي "+f(c.expected)]);
  if(c.I>0&&c.day>=(+c.s.payday||1)&&!c.m.inv)a.push(["blue","$","ما سجّلت استثمار هالشهر: "+usd(c.I/c.s.rate)]);
  return a}

function render(enter,dir){

  moveInd();

  if(enter){[...v.children].forEach((el,i)=>el.style.setProperty("--i",i));
    if(dir){const a=spring({from:0,to:1,response:.42,damping:.9,eps:.001,onUpdate:p=>{v.style.transform=`translateX(${dir*26*(1-p)}px)`},onDone:()=>{v.style.transform=""}});anims.push(a)}}

    v.querySelectorAll("[data-n]").forEach(el=>{const k=el.dataset.n,to=+el.dataset.v,fmt=el.dataset.fmt==="u"?usd:f;
      const from=prevN[k]!==undefined?prevN[k]:(enter?0:to);prevN[k]=to;if(from===to){el.textContent=fmt(to);return}
      anims.push(spring({from,to,response:.9,damping:1,eps:Math.max(.5,Math.abs(to-from)/2000),onUpdate:x=>el.textContent=fmt(x)}))});
    const arc=$("#ringArc");if(arc){const C=2*Math.PI*52,fr=+arc.dataset.frac,from=prevFrac===null?0:prevFrac;prevFrac=fr;
      anims.push(spring({from,to:fr,response:1.1,damping:.86,eps:.0005,onUpdate:x=>arc.style.strokeDashoffset=C*(1-Math.max(0,x))}))}

}

let sw=null;

  sw={w,row:w.querySelector(".row"),x0:e.clientX,y0:e.clientY,dx:0,on:false,h:[],id:e.pointerId};if(w._a)w._a.stop()});
document.addEventListener("pointermove",e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x0,dy=e.clientY-sw.y0;
  if(!sw.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(Math.abs(dx)<10)return;sw.on=true;sw.w.classList.add("on");release();try{sw.w.setPointerCapture(e.pointerId)}catch(_){}}
  const W=sw.w.offsetWidth;let x=Math.min(0,dx);if(dx>0)x=(dx*W*.55)/(W+.55*dx)*.4;sw.dx=x;sw.row.style.transform=`translateX(${x}px)`;
  sw.h.push([performance.now(),x]);if(sw.h.length>6)sw.h.shift();
  if(x<-W*.35&&!sw.armed){sw.armed=true;hap("mid")}else if(x>-W*.35)sw.armed=false});
document.addEventListener("pointerup",e=>{if(!sw||e.pointerId!==sw.id)return;const s=sw;sw=null;if(!s.on)return;
  const h=s.h,v=h.length>1?(h[h.length-1][1]-h[0][1])/((h[h.length-1][0]-h[0][0])/1000||1):0,W=s.w.offsetWidth;
  if(s.dx+project(v,.99)<-W*.4){s.w._a=spring({from:s.dx,to:-W-20,velocity:v,response:.3,damping:1,eps:.5,onUpdate:x=>s.row.style.transform=`translateX(${x}px)`,onDone:()=>removeExp(s.w)})}
  else s.w._a=spring({from:s.dx,to:0,velocity:v,response:.35,damping:.85,eps:.2,onUpdate:x=>s.row.style.transform=`translateX(${x}px)`,onDone:()=>s.w.classList.remove("on")})});
document.addEventListener("pointercancel",()=>{if(sw){const s=sw;sw=null;s.w._a=spring({from:s.dx,to:0,response:.35,damping:1,eps:.2,onUpdate:x=>s.row.style.transform=`translateX(${x}px)`,onDone:()=>s.w.classList.remove("on")})}});
function removeExp(w){const mkey=w.dataset.m,id=w.dataset.id,m=M(mkey),i=m.exp.findIndex(x=>x.id===id);if(i<0)return;

  const H=sheet.offsetHeight;if(shA)shA.stop();shA=spring({from:Math.min(shY??H,H),to:0,response:.42,damping:.86,eps:.3,onUpdate:setSheet})}
function closeSheet(v=0){open=false;scrim.style.pointerEvents="none";document.body.classList.remove("lock");$("#aNote").blur();
  const H=sheet.offsetHeight+30;if(shA)shA.stop();shA=spring({from:shY??0,to:H,velocity:v,response:.36,damping:1,eps:.5,onUpdate:setSheet,onDone:()=>{sheet.style.visibility="hidden"}})}
let drag=null;
[$("#grab"),$("#shh")].forEach(el=>el.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;if(shA)shA.stop();drag={y0:e.clientY-(shY||0),h:[]};el.setPointerCapture(e.pointerId)}));
addEventListener("pointermove",e=>{if(!drag)return;let y=e.clientY-drag.y0;if(y<0)y=-(-y*80)/(80+-y);setSheet(y);drag.h.push([performance.now(),y]);if(drag.h.length>6)drag.h.shift()});
addEventListener("pointerup",()=>{if(!drag)return;const h=drag.h;drag=null;const v=h.length>1?(h[h.length-1][1]-h[0][1])/((h[h.length-1][0]-h[0][0])/1000||1):0;
  if((shY||0)+project(v,.99)>sheet.offsetHeight*.35)closeSheet(v);else{shA=spring({from:shY,to:0,velocity:v,response:.4,damping:.85,eps:.3,onUpdate:setSheet})}});
scrim.addEventListener("click",()=>closeSheet());

$("#pad").innerHTML=["1","2","3","4","5","6","7","8","9","000","0","⌫"].map(k=>`<button class="press${k==="⌫"||k==="000"?" fn":""}" data-key="${k}">${k}</button>`).join("");
function drawAmt(bump){const el=$("#amtv"),n=+amt||0;el.textContent=f(n);el.classList.toggle("zero",!n);
  if(bump){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}previewWarn()}
function key(k){if(k==="⌫"){amt=amt.slice(0,-1);hap();drawAmt(true);return}
  const nx=(amt+k).replace(/^0+/,"");if(nx.length>9){const el=$("#amtv");el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");hap("warn");return}
  amt=nx;hap();drawAmt(true)}
function drawCats(){$("#cats").innerHTML=CATS.filter(c=>c.pick).map(c=>`<button class="cat press" data-cat="${c.k}" style="--c:${c.c}"><i>${svg(IC[c.k])}</i>${esc(c.n)}</button>`).join("")}
function drawSeg(){$("#seg").classList.toggle("b1",dayBack===1)}
function previewWarn(){const a=+amt||0,c=calc(),w=$("#aWarn");w.className="warn";
  if(!a){w.textContent=c.allow-c.tod>0?"حدّك الباقي اليوم "+f(c.allow-c.tod):"";return}
  if(false){w.textContent="ينخصم من صندوق السفر"+(c.travelIn?"، يبقى "+f(c.travel-a):"");return}
  if(dayBack){w.textContent="ينحسب على البارحة";return}
  if(c.spent+a>c.P){w.textContent="هذا يدخلك على فلوس الادخار";w.classList.add("r")}
  else if(c.tod+a>c.allow){w.textContent="أكثر من حدّك اليوم بـ "+f(c.tod+a-c.allow);w.classList.add("o")}
  else w.textContent="يبقى لك اليوم "+f(c.allow-c.tod-a)}
function saveExp(cat){if(cat)newCat=cat;const a=+amt||0;if(!a){const el=$("#amtv");el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");hap("warn");return}
  const before=calc();const d=new Date();if(dayBack)d.setDate(d.getDate()-1);const k=mk(d);
  M(k).exp.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),a,c:newCat,n:$("#aNote").value.trim().slice(0,60),t:d.getTime()});
  save(k);closeSheet();if(tab!=="home"&&tab!=="exp")tab="home";render(false);
  const c=calc();
  if(c.spent>c.P&&before.spent<=before.P){toast("دخلت على فلوس الادخار","r");hap("warn");notify("محفظتي","صرفك دخل على فلوس الادخار")}
  else if(c.spent>=.8*c.P&&before.spent<.8*before.P){toast("وصلت 80% من مصروف الشهر","o");hap("warn");notify("محفظتي","صرفت 80% من مصروف الشهر")}
  else if(c.tod>c.allow&&before.tod<=before.allow){toast("تجاوزت حدّك اليوم","o");hap("warn");notify("محفظتي","تجاوزت حد صرفك اليوم")}
  else{toast("انسجل "+f(a)+" دينار");hap("ok")}}

/* ---------- onboarding ---------- */
let ob={step:0,salary:"",payday:1,rate:"",obl:[{id:"home",n:"البيت أو الإيجار",a:""},{id:"car",n:"السيارة أو البنزين",a:""}],hasLoan:false,loanA:"",loanN:"",payout:"",sav:""};
const OBSTEPS=4;
function closeOnb(){const o=$("#onb");if(o&&!o.hidden){o.hidden=true;document.body.classList.remove("lock")}}
function openOnb(){const o=$("#onb");o.hidden=false;document.body.classList.add("lock");ob.rate=String(S.set.rate||"");drawOnb(0)}
function fmtIn(el){const v=num(el.value);el.value=v?f(v):""}
function drawOnb(dir){
  const st=ob.step,box=$("#onbin");let h="";
  const dots=`<div class="dots">${Array.from({length:OBSTEPS},(_,i)=>`<i class="${i===st?"on":""}"></i>`).join("")}</div>`;
  if(st===0)h=`<div class="ostep"><img class="hero-ic" src="${APPICON}" alt=""><h2 style="text-align:center">أهلاً بيك بمحفظتي</h2><p class="lead" style="text-align:center">نرتب راتبك بثلاث أسئلة سريعة، وبعدها يكلك التطبيق كل يوم شكد تكدر تصرف.</p><div style="flex:1"></div></div>`;
  if(st===1)h=`<div class="ostep"><h2>شكد راتبك الشهري؟</h2><p class="lead">بالدينار العراقي.</p>
    <input class="bigin" id="obSal" inputmode="numeric" placeholder="0" value="${ob.salary?f(ob.salary):""}"><div class="ounit">دينار</div>
    <label class="ofield"><span>يوم نزول الراتب</span><select id="obPay">${Array.from({length:28},(_,i)=>`<option value="${i+1}"${ob.payday===i+1?" selected":""}>${i+1}</option>`).join("")}</select></label>
    <label class="ofield"><span>سعر الدولار</span><input id="obRate" inputmode="numeric" value="${ob.rate?f(ob.rate):""}" placeholder="1500"></label>
    <p class="foot" style="margin:6px 4px 0">الراتب ينقسم ثلاث أقسام: مصروفك، والتزاماتك، والاستثمار. تكدر تغيّر النسب بعدين.</p></div>`;
  if(st===2)h=`<div class="ostep"><h2>عندك التزامات شهرية؟</h2><p class="lead">مصاريف ثابتة تدفعها كل شهر. اتركها فارغة إذا ماكو.</p>
    ${ob.obl.map((o,i)=>`<div class="ofield"><input class="nm" data-ob="n" data-i="${i}" value="${esc(o.n)}" maxlength="30"><input data-ob="a" data-i="${i}" inputmode="numeric" placeholder="0" value="${o.a?f(o.a):""}"></div>`).join("")}
    <button class="link press soft" data-act="obAdd" style="text-align:center">+ أضف التزام</button>
    <h2 style="font-size:22px;margin-top:18px">عندك قسط أو سلفة أو جمعية؟</h2>
    <div class="tog"><button class="press${ob.hasLoan?"":" on"}" data-act="obLoan" data-v="0">لا</button><button class="press${ob.hasLoan?" on":""}" data-act="obLoan" data-v="1">اي</button></div>
    ${ob.hasLoan?`<label class="ofield"><span>القسط الشهري</span><input id="obLA" inputmode="numeric" placeholder="0" value="${ob.loanA?f(ob.loanA):""}"></label>
    <label class="ofield"><span>كم قسط باقي؟</span><input id="obLN" inputmode="numeric" placeholder="0" value="${esc(ob.loanN)}"></label>
    <label class="ofield"><span>تستلم مبلغ بالأخير؟</span><input id="obLP" inputmode="numeric" placeholder="اختياري" value="${ob.payout?f(ob.payout):""}"></label>`:""}</div>`;
  if(st===3){const c=previewSplit();h=`<div class="ostep"><h2>تريد تدخر كل شهر؟</h2><p class="lead">ينخصم من مصروفك الشخصي، ويتجمع بصندوق الطوارئ.${ob.hasLoan&&num(ob.loanA)?" ويبدي بعد ما تخلص الأقساط.":""}</p>
    <input class="bigin" id="obSav" inputmode="numeric" placeholder="0" value="${ob.sav?f(ob.sav):""}"><div class="ounit">دينار بالشهر</div>
    <div class="chips2">${[0,.1,.2].map(x=>{const v=Math.round(c.P*x/1000)*1000;return `<button class="press${num(ob.sav)===v?" on":""}" data-act="obSavQ" data-v="${v}">${x?f(v):"بدون"}</button>`}).join("")}</div>
    <div class="card" style="margin-top:6px"><div class="kv"><span>مصروفك بالشهر</span><b class="num" id="obPrev">${f(c.P-num(ob.sav))}</b></div><div class="kv"><span>تقريباً باليوم</span><b class="num" id="obDay">${f((c.P-num(ob.sav))/30)}</b></div></div></div>`}
  box.innerHTML=dots+h+`<div class="onav">${st?`<button class="back press" data-act="obBack" aria-label="رجوع">›</button>`:""}<button class="cta press" data-act="obNext">${st===0?"يلا نبدي":st===OBSTEPS-1?"خلصنا":"التالي"}</button></div>`;
  const step=box.querySelector(".ostep");
  if(dir&&step)spring({from:0,to:1,response:.42,damping:.86,eps:.001,onUpdate:p=>{step.style.transform=`translateX(${dir*40*(1-p)}px)`;step.style.opacity=Math.min(1,.2+p)}});
  const fi=box.querySelector("#obSal,#obSav");if(fi&&!("ontouchstart" in window))setTimeout(()=>fi.focus(),150);
}
function previewSplit(){const sal=num(ob.salary)||0,obl=ob.obl.reduce((a,o)=>a+num(o.a),0),la=ob.hasLoan?num(ob.loanA):0;
  return la?{P:Math.max(0,sal-obl-la)}:{P:sal*S.set.split.p/100}}
function obCollect(){const g=id=>$(id);
  if(ob.step===1){ob.salary=num(g("#obSal").value);ob.payday=+g("#obPay").value;ob.rate=num(g("#obRate").value)}
  if(ob.step===2&&ob.hasLoan){ob.loanA=num(g("#obLA").value);ob.loanN=num(g("#obLN").value);ob.payout=num(g("#obLP").value)}
  if(ob.step===3){ob.sav=num(g("#obSav").value)}}
function obFinish(){const s=S.set,d=new Date();
  s.salary=num(ob.salary)||s.salary;s.payday=ob.payday||1;if(num(ob.rate))s.rate=num(ob.rate);
  s.obl=ob.obl.filter(o=>o.n.trim()).map((o,i)=>({id:o.id||("o"+i),n:o.n.trim(),a:num(o.a)}));
  if(ob.hasLoan&&num(ob.loanA)&&num(ob.loanN)){const startK=d.getDate()<s.payday?mk(d):addM(mk(d),1),pay=num(ob.payout);
    s.loan={n:"القسط",a:num(ob.loanA),start:startK,end:addM(startK,num(ob.loanN)-1),payout:pay,emerg:Math.round(pay*.3/1000)*1000,travel:0,spread:4}}
  else s.loan=clone(DEF.loan);
  s.sav=Object.assign(clone(DEF.sav),s.sav||{},{monthly:num(ob.sav)});
  s.onboarded=true;save("settings");closeOnb();tab="home";prevFrac=null;render(true);scheduleNative();reSchedule();hap("ok");toast("كلشي جاهز، أهلاً بيك")}

/* ---------- events ---------- */
$("#fab").addEventListener("click",openSheet);
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-cat],[data-key],[data-day]");if(!t)return;
  if(t.dataset.key){key(t.dataset.key);return}
  if(t.dataset.cat){if(!(+amt)){const el=$("#amtv");el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");hap("warn");$("#aWarn").textContent="اكتب المبلغ أول";return}
    t.classList.add("go");setTimeout(()=>saveExp(t.dataset.cat),160);return}
  if(t.dataset.day!==undefined){dayBack=+t.dataset.day;hap();drawSeg();previewWarn();return}
  if(t.dataset.tab){go(t.dataset.tab);return}
  const a=t.dataset.act,c=calc();
  if(a==="close")closeSheet();
  else if(a==="obNext"){obCollect();if(ob.step===1&&!num(ob.salary)){const el=$("#obSal");el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");hap("warn");return}
    hap();if(ob.step<OBSTEPS-1){ob.step++;drawOnb(-1)}else obFinish()}
  else if(a==="obBack"){obCollect();hap();ob.step=Math.max(0,ob.step-1);drawOnb(1)}
  else if(a==="obAdd"){ob.obl.push({id:"o"+Date.now().toString(36),n:"التزام جديد",a:""});hap();drawOnb(0)}
  else if(a==="obLoan"){ob.hasLoan=t.dataset.v==="1";hap();drawOnb(0)}
  else if(a==="obSavQ"){ob.sav=+t.dataset.v;hap();drawOnb(0)}
  else if(a==="install"){DK.install.request().catch(()=>{})}
  else if(a==="enableNotif"){t.disabled=true;DK.permissions.request(["notifications","full-access","menu-bar"]).then(async st=>{
      if(st["full-access"]==="granted"){await setupScheduler().catch(e=>{deskNote="صار خطأ: "+String(e.message||e).slice(0,120)})}else deskNote="الإشعارات تحتاج إذن الوصول الكامل حتى تشتغل والتطبيق مسدود.";
      setupTray();render(false);if(schedOK){hap("ok");toast("تفعّلت الإشعارات")}}).catch(e=>{deskNote=String(e.message||e).slice(0,140);render(false)})}
  else if(a==="testNotif"){APPDIR().then(dir=>DK.childProcess.exec(`wscript.exe "${dir}\\notify.vbs" daily`,{timeout:15000})).then(()=>toast("انرسل إشعار تجريبي")).catch(e=>toast("ما اشتغل: "+String(e.message||e).slice(0,60),"r"))}
  else if(a==="more"){const o=$("#opt");o.hidden=!o.hidden;t.textContent=o.hidden?"المزيد":"إخفاء";hap()}
  else if(a==="saveExp")saveExp();
  else if(a==="paid"||a==="buy"){const on=!t.classList.contains("on");t.classList.toggle("on",on);t.setAttribute("aria-pressed",on);hap(on?"ok":undefined);
    (a==="paid"?c.m.paid:c.m.bought)[t.dataset.id]=on;save(c.k);
    if(a==="buy"){const n=c.s.assets.filter(x=>c.m.bought[x.s]).length;$("#buyTxt").textContent="اشتريت "+n+" من "+c.s.assets.length;$("#buyBar").style.width=n/c.s.assets.length*100+"%";if(n===c.s.assets.length)toast("خلصت استثمار هالشهر")}}
  else if(a==="saved"){c.m.saved=c.SV;save(c.k);render(false);hap("ok");toast("انضافت "+f(c.SV)+" للادخار")}
  else if(a==="payout"){const L=S.set.loan;c.m.payout=true;c.m.saved=(+c.m.saved||0)+(+L.emerg||0);c.m.travelIn=(+c.m.travelIn||0)+(+L.travel||0);save(c.k);render(false);hap("ok");toast("انوزعت: طوارئ وسفر واستثمار")}
  else if(a==="unsave"){c.m.saved=0;save(c.k);render(false);hap()}
  else if(a==="saveInv"){const iqd=num($("#ivA").value),rate=num($("#ivR").value);if(!iqd||!rate)return;c.m.inv={iqd,rate,at:Date.now()};save(c.k);render(false);hap("ok");toast("انسجل استثمار "+usd(iqd/rate))}
  else if(a==="mprev"||a==="mnext"){const[y,m]=expMonth.split("-").map(Number);const d=new Date(y,m-1+(a==="mprev"?-1:1),1);if(mk(d)<=mk(new Date())){expMonth=mk(d);hap();render(true,a==="mprev"?1:-1)}}
  else if(a==="oblAdd"){S.set.obl.push({id:"o"+Date.now().toString(36),n:"التزام جديد",a:0});save("settings");render(false);hap()}
  else if(a==="oblDel"){const i=+t.dataset.i,[x]=S.set.obl.splice(i,1);save("settings");render(false);hap("warn");toast("انحذف "+x.n,"r",()=>{S.set.obl.splice(i,0,x);save("settings");render(false)})}
});
document.addEventListener("keydown",e=>{if(!open)return;if(e.target.id==="aNote"){if(e.key==="Enter")saveExp();return}
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key==="Backspace")key("⌫");else if(e.key==="Enter")saveExp();else if(e.key==="Escape")closeSheet()});
document.addEventListener("input",e=>{const t=e.target,s=S.set;
  if(t.closest&&t.closest("#onb")){if(t.dataset.ob){const o=ob.obl[+t.dataset.i];if(o){if(t.dataset.ob==="n")o.n=t.value;else o.a=num(t.value)}}
    if(t.id==="obSav"){ob.sav=num(t.value);const c=previewSplit(),p=$("#obPrev"),dd=$("#obDay");if(p)p.textContent=f(c.P-ob.sav);if(dd)dd.textContent=f((c.P-ob.sav)/30)}
    if(t.inputMode==="numeric"&&t.id!=="obLN"){const pos=t.value.length;const v=num(t.value);t.value=v?f(v):"";}
    return}
  if(t.dataset.set){if(t.dataset.set==="remind")s.remind=t.value;else{const v=num(t.value);if(t.dataset.set==="payday")s.payday=Math.min(28,Math.max(1,v||1));else if(v)s[t.dataset.set]=v}
    save("settings");notes();if(t.dataset.set==="remind"||t.dataset.set==="payday"){scheduleNative();reSchedule()}}
  else if(t.dataset.split){s.split[t.dataset.split]=num(t.value);save("settings");notes()}
  else if(t.dataset.loan){s.loan=s.loan||clone(DEF.loan);const k=t.dataset.loan;s.loan[k]=(k==="start"||k==="end")?t.value:num(t.value);save("settings");notes()}
  else if(t.dataset.sav){s.sav=s.sav||clone(DEF.sav);const k=t.dataset.sav;s.sav[k]=k==="name"?t.value.slice(0,30):num(t.value);save("settings");notes()}
  else if(t.dataset.obl!==undefined){const o=s.obl[+t.dataset.obl];if(!o)return;if(t.dataset.f==="n")o.n=t.value.slice(0,30);else o.a=num(t.value);save("settings")}
  else if(t.dataset.asset!==undefined){const x=s.assets[+t.dataset.asset];if(x){x.p=num(t.value);save("settings")}}});

document.addEventListener("focusout",e=>{const t=e.target;if(t.classList&&t.classList.contains("fmt")&&!t.dataset.split&&t.dataset.asset===undefined&&t.dataset.set!=="payday"&&t.dataset.loan!=="spread"){const v=num(t.value);t.value=v?f(v):""}});
setSheet(2000);
render(true);scheduleNative();initDb();initDesktop();
if(!S.set.onboarded)openOnb();
document.fonts&&document.fonts.ready.then(()=>{indX=null;moveInd()});
}
</script>
