<script>/* Al-Basheer — live content layer.
   The site ships with built-in content. content.json (written by admin.html) is fetched at start-up and
   layered on top: patient gallery, doctor edits / new doctors / order / hidden, and a few texts. */
(function () {
  var LN = ['ar', 'en', 'ru', 'tm'];
  window.__bsCMS = null;
  window.__bsCMSP = (function () {
    try {
      return fetch('content.json?ts=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (c) { window.__bsCMS = c; return c; })
        .catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  })();

  function isL(v) { return v && typeof v === 'object' && !Array.isArray(v) && ('ar' in v || 'en' in v); }
  function fillL(v) { // make every language present (fallback: ar → en → any)
    if (!isL(v)) return v;
    var any = v.ar || v.en || v.ru || v.tm || '';
    var o = {}; LN.forEach(function (l) { o[l] = (v[l] && String(v[l]).trim()) ? v[l] : (v.ar || v.en || any); }); return o;
  }
  function mergeL(a, b) {
    if (!isL(b)) return a;
    var o = {}; LN.forEach(function (l) { o[l] = (b[l] && String(b[l]).trim()) ? b[l] : (a ? a[l] : ''); }); return fillL(o);
  }
  function merge(base, ov) {
    var d = {}; for (var k in base) d[k] = base[k];
    for (var k2 in ov) {
      var v = ov[k2];
      if (k2 === 'hidden') continue;
      if (v === '' || v === null || v === undefined) continue;
      if (isL(v)) d[k2] = mergeL(base[k2], v);
      else if (Array.isArray(v)) d[k2] = v.map(fillL);
      else d[k2] = v;
    }
    return d;
  }
  var ART = { ar: 'مستشفيات أرتميس', en: 'Artemis Hospitals', ru: 'Больницы Artemis', tm: 'Artemis hassahanalary' };
  var GUR = { ar: 'غورغاون', en: 'Gurugram', ru: 'Гуруграм', tm: 'Gurugram' };
  function fresh(o, key) {
    var name = fillL(o.name || { ar: key });
    var d = {
      key: key, filter: o.filter || 'heart', icon: o.icon || 'heart', img: o.img || '', exp: +o.exp || 0,
      name: name, title: fillL(o.title || o.spec || name), spec: fillL(o.spec || { ar: '' }),
      area: fillL(o.area || o.spec || { ar: '' }), big: fillL(o.big || { ar: 'الطب', en: 'CARE', ru: 'МЕД', tm: 'LUKMAN' }),
      card: fillL(o.card || o.spec || { ar: '' }), langs: fillL(o.langs || { ar: 'الإنكليزية، الهندية', en: 'English, Hindi', ru: 'английский, хинди', tm: 'iňlis, hindi' }),
      hospital: fillL(o.hospital || ART), city: fillL(o.city || GUR),
      specialties: [], profile: [], qualifications: [], procedures: [], conditions: [], focus: [], memberships: [], awards: [], pubs: []
    };
    return merge(d, o);
  }
  /* base: the built-in doctor list. Returns the list as edited in the admin page. */
  window.__bsDocs = function (base, c) {
    c = c || window.__bsCMS;
    if (!c || !c.doctors) return base;
    var items = c.doctors.items || {}, map = {}, keys = [];
    base.forEach(function (d) { map[d.key] = d; keys.push(d.key); });
    Object.keys(items).forEach(function (k) {
      var o = items[k] || {};
      if (map[k]) map[k] = merge(map[k], o);
      else if (o.name) { map[k] = fresh(o, k); keys.push(k); }
    });
    var order = (c.doctors.order && c.doctors.order.length) ? c.doctors.order.slice() : keys;
    keys.forEach(function (k) { if (order.indexOf(k) < 0) order.push(k); });
    return order.filter(function (k) { return map[k] && !(items[k] && items[k].hidden); }).map(function (k) { return map[k]; });
  };
  /* t: the built-in texts for one language. */
  // partner hospitals: per-hospital overrides from the panel ({ key: { img, hidden, order } })
  window.__bsHosps = function (base, c) {
    c = c || window.__bsCMS; var o = c && c.hosps; if (!o) return base;
    var out = base.map(function (h) { var x = o[h.key]; if (!x) return h; var n = {}; for (var k in h) n[k] = h[k]; for (var k2 in x) if (x[k2] !== '' && x[k2] != null) n[k2] = x[k2]; if (n.img === 'none') { n.img = ''; n.credit = ''; } return n; });
    if (c.hospOrder && c.hospOrder.length) out.sort(function (a, b) { var i = c.hospOrder.indexOf(a.key), j = c.hospOrder.indexOf(b.key); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); });
    return out;
  };
  window.__bsText = function (t, lang, c) {
    c = c || window.__bsCMS;
    if (!c || !c.text || !c.text[lang]) return t;
    var o = {}; for (var k in t) o[k] = t[k];
    var x = c.text[lang]; for (var k2 in x) if (x[k2] && String(x[k2]).trim()) o[k2] = x[k2];
    // the consultation price set in the panel flows into every other sentence that quotes it
    var P = x.cPrice && String(x.cPrice).trim();
    if (P) {
      var OLD = { ar: [/من\s*40\s*(?:إلى|الى|-|–)\s*50\s*دولار/g], en: [/from \$40 to \$50/g, /\$40\s*[–-]\s*\$50/g, /\$40 to \$50/g], ru: [/от 40 до 50 \$/g, /40\s*[–-]\s*50 \$/g], tm: [/40\s*[–-]\s*50 \$/g] }[lang] || [];
      for (var k3 in o) {
        if (k3 === 'cPrice' || (x[k3] && String(x[k3]).trim()) || typeof o[k3] !== 'string') continue;
        var v = o[k3]; for (var i = 0; i < OLD.length; i++) v = v.replace(OLD[i], P);
        o[k3] = v;
      }
      if (!(x.priceVal && String(x.priceVal).trim())) o.priceVal = P;
    }
    return o;
  };
})();
</script>

@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:none}}

@media (max-width: 760px){

  .bs form[role="search"] > div:last-child{flex-wrap:nowrap !important;overflow-x:auto;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none}
  .bs form[role="search"] > div:last-child::-webkit-scrollbar{display:none}

}

/* ---- heartbeat intro v3: patient-monitor ---- */

  -webkit-mask:radial-gradient(80% 70% at 50% 50%,#000 30%,transparent 85%);mask:radial-gradient(80% 70% at 50% 50%,#000 30%,transparent 85%)}

.bs .in-cv{position:relative;width:100%;height:clamp(180px,34vh,300px);align-self:center;display:block}

.bs .in-l{position:absolute;inset:0;margin:0;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:0 .26em;text-align:center;
  font-size:clamp(22px,3.3vw,34px);font-weight:500;line-height:1.3;letter-spacing:0;color:#F3FBFA;transition:color 1.1s cubic-bezier(.16,1,.3,1)}

  .bs #treatments .tile b{font-size:12.5px !important;line-height:1.3}

  /* journey: swipe through the steps */
  .bs #journey > div{gap:22px !important}
  .bs #journey > div > div:nth-child(2){flex-direction:row !important;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px !important;margin:0 -18px;padding:4px 18px 10px;scroll-padding-inline:18px;scrollbar-width:none;overscroll-behavior-x:contain}
  .bs #journey > div > div:nth-child(2)::-webkit-scrollbar{display:none}
  .bs #journey .stack-card{position:relative !important;top:auto !important;flex:0 0 80%;min-height:0 !important;height:auto !important;scroll-snap-align:start}
  .bs #journey .stack-card h3{font-size:21px !important}
  .bs #journey .stack-card p{font-size:14.5px !important}

  /* why: 2-up, titles only */
  .bs #why .stagger{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:8px !important}
  .bs #why .lift{flex-direction:column !important;align-items:flex-start !important;padding:16px !important;gap:10px !important}
  .bs #why .lift span[style*="font-size: 15.5px"]{display:none !important}
  .bs #why .lift b{font-size:15px !important;line-height:1.35}

  /* footer: drop the sitemap column */
  .bs footer [style*="gap: 70px"] > div:first-child{display:none !important}

  /* rails feel like an app carousel: cards settle in as they reach the middle */
  @supports (animation-timeline: view(inline)){
    .bs #doctors .dgrid > *,.bs #services .stagger > *,.bs #hospitals .stagger > *,.bs #stories .stagger > *,.bs #articles .stagger > *,.bs #journey .stack-card{
      animation:railIn linear both !important;animation-timeline:view(inline) !important;animation-range:cover 0% cover 100% !important}
  }
  @keyframes railIn{0%{scale:.9;opacity:.55}30%,70%{scale:1;opacity:1}100%{scale:.9;opacity:.55}}
}

/* ================= phone v3: hero as one photo card, cleaner consult ================= */
@media (max-width:760px){
  /* header: solid enough to read on any phone (some in-app browsers skip the blur) */
  .bs .glassnav{background:rgba(255,255,255,.94) !important}

  /* hero = one card: photo with the headline on it, actions right under */
  .bs #top{display:grid !important;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto 20px auto auto;padding:84px 14px 0 !important;margin-top:-78px}
  .bs #top .hero-text{display:contents !important}
  .bs #top .hero-text > span.hin{display:none !important}
  .bs #top .loadup{grid-row:1 / 5;grid-column:1;margin:0 !important;padding:0 !important}
  .bs .hero-frame{height:min(64vh,520px) !important;margin:0 !important;border-radius:28px !important}
  .bs .hero-frame > div[aria-hidden="true"]:not(.ecgw-wrap){background:linear-gradient(180deg,rgba(8,24,34,0) 28%,rgba(8,24,34,.35) 55%,rgba(8,24,34,.82) 100%) !important}
  .bs .hero-frame > svg,.bs .ecgw-wrap{bottom:auto !important;top:14% !important}
  .bs #top h1{grid-row:2;grid-column:1;z-index:3;align-self:end;color:#FFFFFF;margin:0 !important;padding:0 20px;text-align:start !important;font-size:clamp(32px,9.4vw,40px) !important;line-height:1.15 !important;text-wrap:balance;text-shadow:0 2px 18px rgba(0,0,0,.25)}
  .bs #top h1 .wd.w1{color:#FFFFFF !important}
  .bs #top h1 .wd.w2{color:#8FE8D4 !important}
  .bs #top .hero-text > p{grid-row:3;grid-column:1;z-index:3;margin:10px 0 0 !important;padding:0 20px;text-align:start !important;color:rgba(255,255,255,.86) !important;font-size:15px !important;line-height:1.65 !important;max-width:none !important}
  .bs #top .hero-text > div{grid-row:5;grid-column:1;display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;gap:8px !important;margin-top:14px !important;width:auto !important}
  .bs #top .hero-text > div > a:first-child{flex:1;height:56px !important;width:auto !important;border-radius:18px !important;font-size:16px !important}
  .bs #top .hero-text > div > a[href*="wa.me"]{flex:none;width:56px !important;height:56px !important;padding:0 !important;border-radius:18px !important;font-size:0 !important;gap:0 !important;justify-content:center}
  .bs #top .hero-text > div > a[href*="wa.me"] > span{font-size:24px !important}
  /* trust points: one swipeable line of chips */
  .bs #top .hero-text > ul{grid-row:6;grid-column:1;display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;justify-content:flex-start !important;gap:8px !important;overflow-x:auto;margin:12px -14px 0 !important;padding:0 14px 2px !important;scrollbar-width:none;font-size:13px !important}
  .bs #top .hero-text > ul::-webkit-scrollbar{display:none}
  .bs #top .hero-text > ul > li{flex:none;white-space:nowrap;height:38px;padding:0 14px;border-radius:999px;background:#FFFFFF;border:1px solid #E3ECEA;color:#0E2A3B;font-weight:600}

  /* quick access: 2 x 2, icon beside label */
  .bs .mq{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:8px !important;padding:12px 14px 0 !important}
  .bs .mq-t{flex-direction:row !important;justify-content:flex-start !important;gap:12px !important;padding:10px 12px !important;border-radius:18px !important;min-height:64px}
  .bs .mq-ic{flex:none;width:42px !important;height:42px !important;border-radius:13px !important;font-size:20px !important}
  .bs .mq-t b{font-size:14px !important;text-align:start !important;line-height:1.3}
  .bs .rv{padding-top:56px !important}

  /* online consultation: price as one clean line, steps as a numbered list */
  .bs #consult [style*="padding: 18px 22px"]{display:grid !important;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:14px !important;row-gap:10px !important;align-items:center;padding:16px !important;border-radius:22px !important}
  .bs #consult [style*="padding: 18px 22px"] > span:first-child{grid-row:1 / 3;width:52px !important;height:52px !important;border-radius:16px !important}
  .bs #consult [style*="padding: 18px 22px"] > span:nth-child(2){grid-column:2;gap:0 !important}
  .bs #consult [style*="padding: 18px 22px"] > span:nth-child(2) > span{font-size:13px !important}
  .bs #consult b[style*="font-size: 28px"]{font-size:22px !important;white-space:nowrap;line-height:1.3 !important}
  .bs #consult [style*="padding: 18px 22px"] > span:nth-child(3){grid-column:2;justify-self:start;font-size:12.5px !important;padding:6px 10px !important}
  .bs #consult [style*="grid-template-columns: repeat(3, minmax(0"]{display:flex !important;flex-direction:column !important;gap:0 !important;border-radius:20px;overflow:hidden;background:#FFFFFF;border:1px solid #E3ECEA;counter-reset:cstep}
  .bs #consult [style*="grid-template-columns: repeat(3, minmax(0"] > div{flex-direction:row !important;align-items:center !important;text-align:start !important;gap:12px !important;padding:13px 14px !important;border-radius:0 !important;background:transparent !important;border:0 !important;box-shadow:none !important;counter-increment:cstep}
  .bs #consult [style*="grid-template-columns: repeat(3, minmax(0"] > div + div{border-top:1px solid #EEF3F2 !important}
  .bs #consult [style*="grid-template-columns: repeat(3, minmax(0"] > div > span{width:34px !important;height:34px !important;border-radius:11px !important;flex:none}
  .bs #consult [style*="grid-template-columns: repeat(3, minmax(0"] b{font-size:14.5px !important;flex:1}
  .bs #consult [style*="grid-template-columns: repeat(3, minmax(0"] > div::after{content:counter(cstep);flex:none;width:24px;height:24px;border-radius:50%;background:#E8F3F1;color:#0F766E;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .bs #consult a[href="booking.html"]{height:56px !important;border-radius:18px !important}
}

/* ================= phone v4: wow polish ================= */
@media (max-width:760px){
  /* one rhythm for every section title: aligned to the reading side, with a small teal accent */
  .bs section[id]:not(#top):not(#contact) .rise[style*="text-align: center"],.bs .rv-head{text-align:start !important;align-items:flex-start !important;margin-inline:0 !important}
  .bs section[id]:not(#top):not(#contact) h2,.bs .rv-head h2{text-align:start !important;font-size:30px !important;line-height:1.22 !important}
  .bs section[id]:not(#top):not(#contact) h2::before,.bs .rv-head h2::before{content:"";display:block;width:34px;height:4px;border-radius:4px;margin-bottom:14px;background:linear-gradient(90deg,#0F766E,#2DD4BF)}
  .bs .rv-head{padding:0 18px !important}

  /* hero photo breathes slowly (transform only) */
  .bs .hero-img{animation:kenB 16s ease-in-out infinite alternate !important;transform-origin:50% 60%}
  @keyframes kenB{from{transform:scale(1.02)}to{transform:scale(1.12)}}


  /* "start your journey": living gradient + soft moving light */
  .bs #contact > .rise{isolation:isolate;border-radius:30px !important}
  .bs #contact > .rise::before,.bs #contact > .rise::after{content:"";position:absolute;z-index:-1;width:320px;height:320px;border-radius:50%;pointer-events:none;will-change:transform}
  .bs #contact > .rise::before{top:-120px;inset-inline-start:-90px;background:radial-gradient(circle,rgba(45,212,191,.55),rgba(45,212,191,0) 65%);animation:orbA 9s ease-in-out infinite alternate}
  .bs #contact > .rise::after{bottom:-140px;inset-inline-end:-110px;background:radial-gradient(circle,rgba(96,165,250,.38),rgba(96,165,250,0) 65%);animation:orbB 11s ease-in-out infinite alternate}
  @keyframes orbA{to{transform:translate3d(90px,120px,0) scale(1.15)}}
  @keyframes orbB{to{transform:translate3d(-80px,-110px,0) scale(1.2)}}
  .bs #contact h2{font-size:30px !important}
  .bs #contact a{height:56px !important;border-radius:18px !important;width:100%}

  /* stories: softer, more editorial quote cards */
  .bs #stories figure{position:relative;overflow:hidden;border:0 !important;border-radius:24px !important;box-shadow:0 18px 40px -30px rgba(14,42,59,.45)}
  .bs #stories figure::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#0F766E,#2DD4BF)}
  .bs #stories blockquote{font-size:16px !important}
}
.bs > section.off .hero-img,.bs > section.off .rise::before,.bs > section.off .rise::after{animation-play-state:paused}

/* phone: doctor cards — photo on top (full figure), info panel below, no overlap */
@media (max-width:760px){
  .bs #doctors .dk{aspect-ratio:auto !important;display:flex;flex-direction:column;height:auto}
  .bs #doctors .dk-ph{position:relative !important;inset:auto !important;top:auto !important;height:320px;margin-top:48px;flex:none;z-index:1}
  .bs #doctors .dk-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain !important;object-position:50% 100% !important;transform:none !important}
  .bs #doctors .dk::after{display:none}
  .bs #doctors .dk-g{position:relative !important;inset:auto !important;bottom:auto !important;margin:-30px 10px 10px;z-index:3;background:rgba(255,255,255,.97) !important;box-shadow:0 -18px 30px -20px rgba(0,0,0,.5)}
  .bs #doctors .dk-on{top:12px !important;inset-inline-start:12px !important;max-width:calc(100% - 120px)}
  .bs #doctors .dk-exp{top:12px !important;inset-inline-end:12px !important;flex-direction:row;gap:5px;min-width:0;height:26px;padding:0 10px;border-radius:999px;font-size:10.5px;white-space:nowrap}
  .bs #doctors .dk-exp b{font-size:14px;line-height:1}
  .bs #doctors .dk-n{font-size:20px;line-height:1.2}
  .bs #doctors .dk-sp{font-size:12.5px;line-height:1.45}
}
@media (max-width:760px){
  .bs #doctors .dk-on{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block !important;line-height:26px;height:26px !important;padding:0 10px 0 9px !important;font-size:10.5px !important}
  .bs #doctors .dk-on i{display:inline-block;vertical-align:middle;margin-inline-end:5px}
}
@media (max-width:370px){ .bs #doctors .dk-on{font-size:9.5px !important} .bs #doctors .dk-exp{padding:0 8px;font-size:9.5px} }
@media (max-width:760px){
  .bs .mq-t{gap:10px !important;padding:10px !important;min-width:0}
  .bs .mq-ic{width:38px !important;height:38px !important;border-radius:12px !important;font-size:18px !important}
  .bs .mq-t b{min-width:0;font-size:13.5px !important;line-height:1.25 !important;overflow-wrap:anywhere;text-wrap:balance}
}

/* phone perf: reel cards are already their own 3D layers — drop the per-card shadow paint */
@media (max-width:760px){ .bs .cy-c{box-shadow:none !important} }
/* native-feel basics: instant taps, no sideways rubber-band, crisp text */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-x:none}
.bs a,.bs button,.bs [role="button"],.bs summary{touch-action:manipulation}
.bs{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
@media (max-width:760px){
  .bs a,.bs button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
}

 <div class="hero-text" style="position: relative; z-index: 2; max-width: 980px; margin: 0 auto; padding: 0 28px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 22px">

<!-- DOCTORS -->
<section id="doctors" style="padding: 120px 0 110px">
 <div style="max-width: 1360px; margin: 0 auto; padding: 0 28px">
  <div class="dhead rise">
   <div style="display: flex; flex-direction: column; gap: 14px; max-width: 640px">
    <h2 style="font-weight: 800; font-size: 52px; line-height: 1.12; text-wrap: balance">{{t.docTitle}}</h2>
    <p style="font-size: 18px; color: #5B6B80; line-height: 1.7">{{t.docLede}}</p>
   </div>
   <div class="dtabs" role="group" aria-label="{{t.filterAria}}">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="7"><button type="button" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}">{{f.label}}</button></sc-for>
   </div>
  </div>
  <div class="dgrid {{gridCls}}" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 26px">
   <sc-for list="{{doctors}}" as="d" hint-placeholder-count="6">
    <article class="dk" onPointerMove="{{tilt}}" onPointerLeave="{{untilt}}">
     <a class="dk-ph" href="doctor.html?d={{d.key}}" tabindex="-1" aria-hidden="true"><img src="{{d.img}}" alt="" loading="lazy"></a>
     <span class="dk-sheen" aria-hidden="true"></span>
     <span class="dk-on"><i></i>{{t.dcOnline}}</span>
     <span class="dk-exp"><b>{{d.exp}}</b>{{t.dcExp}}</span>
     <div class="dk-g">
      <span class="dk-sp">{{d.spec}}</span>
      <h3 class="dk-n"><a href="doctor.html?d={{d.key}}">{{d.name}}</a></h3>
      <span class="dk-m"><span class="dk-ic"><svg aria-hidden="true" focusable="false" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="M12 6v4"></path><path d="M14 14h-4"></path><path d="M14 18h-4"></path><path d="M14 8h-4"></path><path d="M18 12h2a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h2"></path><path d="M18 22V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v18"></path></svg></span>{{d.meta}}</span>
      <div class="dk-x"><div><p class="dk-bio">{{d.bio}}</p><span class="dk-m"><span class="dk-ic"><svg aria-hidden="true" focusable="false" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="m5 8 6 6"></path><path d="m4 14 6-6 2-3"></path><path d="M2 5h12"></path><path d="M7 2h1"></path><path d="m22 22-5-10-5 10"></path><path d="M14 18h6"></path></svg></span>{{d.langs}}</span></div></div>
      <div class="dk-act">
       <a class="dk-book" href="booking.html?d={{d.key}}">{{t.dcBook}}</a>
       <a class="dk-go" href="doctor.html?d={{d.key}}" aria-label="{{t.docProfile}}"><svg class="flipx-i" aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></a>
      </div>
     </div>
    </article>
   </sc-for>
  </div>
 </div>
</section>

   <span style="align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #FFFFFF; color: #0F766E; font-size: 13.5px; font-weight: 800"><span style="display: flex"><svg aria-hidden="true" focusable="false" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg></span>{{t.cBadge}}</span>

    <span style="display: flex; flex-direction: column; gap: 2px; flex: 1"><span style="font-size: 14px; color: #5B6B80">{{t.cPriceLabel}}</span><b style="font-size: 28px; font-weight: 900; color: #0F766E">{{t.cPrice}}</b></span>

   </div>
   <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 560px">
