<script>/* Al-Basheer — live content layer.
   The site ships with built-in content. content.json (written by admin.html) is fetched at start-up and
   layered on top: patient gallery, doctor edits / new doctors / order / hidden, and a few texts. */
(function () {
  var LN = ['ar', 'en', 'ru', 'tm'];
  window.__bsCMS = null;
  window.__bsCMSP = (function () {
    try {
      return fetch('content.json?ts=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (c) { window.__bsCMS = c; return c; })
        .catch(function () { return null; });
    } catch (e) { return Promise.resolve(null); }
  })();

  function isL(v) { return v && typeof v === 'object' && !Array.isArray(v) && ('ar' in v || 'en' in v); }
  function fillL(v) { // make every language present (fallback: ar → en → any)
    if (!isL(v)) return v;
    var any = v.ar || v.en || v.ru || v.tm || '';
    var o = {}; LN.forEach(function (l) { o[l] = (v[l] && String(v[l]).trim()) ? v[l] : (v.ar || v.en || any); }); return o;
  }
  function mergeL(a, b) {
    if (!isL(b)) return a;
    var o = {}; LN.forEach(function (l) { o[l] = (b[l] && String(b[l]).trim()) ? b[l] : (a ? a[l] : ''); }); return fillL(o);
  }
  function merge(base, ov) {
    var d = {}; for (var k in base) d[k] = base[k];
    for (var k2 in ov) {
      var v = ov[k2];
      if (k2 === 'hidden') continue;
      if (v === '' || v === null || v === undefined) continue;
      if (isL(v)) d[k2] = mergeL(base[k2], v);
      else if (Array.isArray(v)) d[k2] = v.map(fillL);
      else d[k2] = v;
    }
    return d;
  }
  var ART = { ar: 'مستشفيات أرتميس', en: 'Artemis Hospitals', ru: 'Больницы Artemis', tm: 'Artemis hassahanalary' };
  var GUR = { ar: 'غورغاون', en: 'Gurugram', ru: 'Гуруграм', tm: 'Gurugram' };
  function fresh(o, key) {
    var name = fillL(o.name || { ar: key });
    var d = {
      key: key, filter: o.filter || 'heart', icon: o.icon || 'heart', img: o.img || '', exp: +o.exp || 0,
      name: name, title: fillL(o.title || o.spec || name), spec: fillL(o.spec || { ar: '' }),
      area: fillL(o.area || o.spec || { ar: '' }), big: fillL(o.big || { ar: 'الطب', en: 'CARE', ru: 'МЕД', tm: 'LUKMAN' }),
      card: fillL(o.card || o.spec || { ar: '' }), langs: fillL(o.langs || { ar: 'الإنكليزية، الهندية', en: 'English, Hindi', ru: 'английский, хинди', tm: 'iňlis, hindi' }),
      hospital: fillL(o.hospital || ART), city: fillL(o.city || GUR),
      specialties: [], profile: [], qualifications: [], procedures: [], conditions: [], focus: [], memberships: [], awards: [], pubs: []
    };
    return merge(d, o);
  }
  /* base: the built-in doctor list. Returns the list as edited in the admin page. */
  window.__bsDocs = function (base, c) {
    c = c || window.__bsCMS;
    if (!c || !c.doctors) return base;
    var items = c.doctors.items || {}, map = {}, keys = [];
    base.forEach(function (d) { map[d.key] = d; keys.push(d.key); });
    Object.keys(items).forEach(function (k) {
      var o = items[k] || {};
      if (map[k]) map[k] = merge(map[k], o);
      else if (o.name) { map[k] = fresh(o, k); keys.push(k); }
    });
    var order = (c.doctors.order && c.doctors.order.length) ? c.doctors.order.slice() : keys;
    keys.forEach(function (k) { if (order.indexOf(k) < 0) order.push(k); });
    return order.filter(function (k) { return map[k] && !(items[k] && items[k].hidden); }).map(function (k) { return map[k]; });
  };
  /* t: the built-in texts for one language. */
  window.__bsText = function (t, lang, c) {
    c = c || window.__bsCMS;
    if (!c || !c.text || !c.text[lang]) return t;
    var o = {}; for (var k in t) o[k] = t[k];
    var x = c.text[lang]; for (var k2 in x) if (x[k2] && String(x[k2]).trim()) o[k2] = x[k2];
    // the consultation price set in the panel flows into every other sentence that quotes it
    var P = x.cPrice && String(x.cPrice).trim();
    if (P) {
      var OLD = { ar: [/من\s*40\s*(?:إلى|الى|-|–)\s*50\s*دولار/g], en: [/from \$40 to \$50/g, /\$40\s*[–-]\s*\$50/g, /\$40 to \$50/g], ru: [/от 40 до 50 \$/g, /40\s*[–-]\s*50 \$/g], tm: [/40\s*[–-]\s*50 \$/g] }[lang] || [];
      for (var k3 in o) {
        if (k3 === 'cPrice' || (x[k3] && String(x[k3]).trim()) || typeof o[k3] !== 'string') continue;
        var v = o[k3]; for (var i = 0; i < OLD.length; i++) v = v.replace(OLD[i], P);
        o[k3] = v;
      }
      if (!(x.priceVal && String(x.priceVal).trim())) o.priceVal = P;
    }
    return o;
  };
})();
</script>

   </div>

 <a href="{{bookHref}}" style="height: 44px; padding: 0 22px; border-radius: 999px; background: {{accent}}; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-weight: 600; font-size: 15px">{{t.bookShort}}</a>
</div>
</nav>
</header>

    <div><b>{{D.city}}</b><span>{{t.cityLbl}}</span></div>

<section class="pf">
 <div class="pf-about">
  <div class="pf-prose rise {{D.aboutCls}}">
   <span class="pf-eb">{{t.ebProfile}}</span>
   <h2 class="pf-h">{{t.aboutDoc}}</h2>
   <sc-for list="{{D.profile}}" as="p" hint-placeholder-count="3"><p>{{p.x}}</p></sc-for>
   <button type="button" class="pf-more pf-rd" onClick="{{toggleAbout}}">{{D.aboutBtn}} <span style="display: flex"><svg aria-hidden="true" focusable="false" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="m6 9 6 6 6-6"></path></svg></span></button>
   <div class="pf-stats">
    <sc-for list="{{D.stats}}" as="st" hint-placeholder-count="4"><div class="pf-stat"><b>{{st.n}}</b><span>{{st.l}}</span></div></sc-for>
   </div>
  </div>
  <aside class="pf-side rise">
   <h3>{{t.secSpec}}</h3>
   <sc-for list="{{D.specialties}}" as="sp" hint-placeholder-count="4"><div class="pf-sp"><i></i><span>{{sp.x}}</span></div></sc-for>
  </aside>
 </div>
</section>

<section class="pf-band">
 <div class="pf">
  <div class="pf-block rise">
   <div class="pf-head"><div style="display: flex; flex-direction: column; gap: 12px"><span class="pf-eb">{{t.ebClinical}}</span><h2 class="pf-h">{{t.secProc}}</h2></div><span class="pf-count">{{D.procN}}</span></div>

  </div>

  <div class="pf-block rise">
   <h2 class="pf-h">{{t.secCond}}</h2>
   <div class="pf-chips"><sc-for list="{{D.conditions}}" as="c" hint-placeholder-count="5"><span class="pf-chip"><i></i>{{c.x}}</span></sc-for></div>
  </div>

   <div class="pf-chips"><sc-for list="{{D.focus}}" as="f" hint-placeholder-count="5"><span class="pf-chip"><i></i>{{f.x}}</span></sc-for></div>
  </div>
  </sc-if>
 </div>
</section>

<section class="pf">
 <div class="pf-two">
  <div class="rise" style="display: flex; flex-direction: column; gap: 24px">
   <span class="pf-eb">{{t.ebEdu}}</span>
   <h2 class="pf-h">{{t.secQual}}</h2>
   <div class="pf-tl"><sc-for list="{{D.qualifications}}" as="q" hint-placeholder-count="4"><div class="pf-ti">{{q.x}}</div></sc-for></div>
  </div>
  <sc-if value="{{D.hasMem}}" hint-placeholder-val="{{false}}">

   <span class="pf-eb">{{t.ebMem}}</span>

  </div>
  </sc-if>

</section>

<sc-if value="{{D.hasAw}}" hint-placeholder-val="{{false}}">
<section class="pf-aw">
 <div class="pf">
  <div class="pf-block rise">
   <div class="pf-head"><div style="display: flex; flex-direction: column; gap: 12px"><span class="pf-eb">{{t.ebAw}}</span><h2 class="pf-h">{{t.secAw}}</h2></div><span class="pf-count">{{D.awN}}</span></div>

  <sc-if value="{{D.pubMore}}" hint-placeholder-val="{{true}}"><button type="button" class="pf-more {{D.pubCls}}" onClick="{{togglePubs}}" aria-expanded="{{D.pubA}}">{{D.pubBtn}} <span style="display: flex"><svg aria-hidden="true" focusable="false" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><path d="m6 9 6 6 6-6"></path></svg></span></button></sc-if>

</div>

": "Dr. Hemant Sharma", "ru": "Д-р Хемант Шарма", "tm": "Dr. Hemant Şarma"}, "title": {"ar": "رئيس قسم استبدال المفاصل بالروبوت وجراحة المناظير وإصابات الملاعب والكسور", "en": "Chairperson – Robotic Joint Replacement, Arthroscopy Surgery, Sports Injuries & Trauma", "ru": "Председатель отделения роботизированного эндопротезирования, артроскопии, спортивной травмы и травматологии", "tm": "Robot bilen bogun çalyşmak, artroskopiýa, sport şikesleri we trawmatologiýa bölüminiň başlygy"}, "spec": {"ar": "جراح استبدال المفاصل بالروبوت", "en": "Robotic joint replacement surgeon", "ru": "Хирург роботизированного эндопротезирования", "tm": "Robot bilen bogun çalyşýan hirurg"}, "area": {"ar": "المفاصل وإصابات الملاعب", "en": "Joints & sports injuries", "ru": "Суставы и спортивные травмы", "tm": "Bogunlar we sport şikesleri"}, "big": {"ar": "المفاصل", "en": "JOINTS", "ru": "СУСТАВЫ", "tm": "BOGUN"}, "card": {"ar": "خبرة 30 سنة بين الهند وبريطانيا في استبدال الورك والركبة والكتف والجراحة بالروبوت.", "en": "30 years across India and the UK in hip, knee and shoulder replacement and robotic surgery.", "ru": "30 лет в Индии и Великобритании: эндопротезирование тазобедренного, коленного и плечевого суставов, роботизированная хирургия.", "tm": "Hindistanda we Beýik Britaniýada 30 ýyl: but, dyz we egin bogunlaryny çalyşmak, robot hirurgiýasy."}, "langs": {"ar": "الإنكليزية، الهندية، البنجابية", "en": "English, Hindi, Punjabi", "ru": "английский, хинди, панджаби", "tm": "iňlis, hindi, penjabi"}, "specialties": [{"ar": "استبدال الورك والركبة والكتف", "en": "Hip, Knee & Shoulder Replacement", "ru": "Эндопротезирование тазобедренного, коленного и плечевого суставов", "tm": "But, dyz we egin bogunlaryny çalyşmak"}, {"ar": "جراحة العظام", "en": "Orthopaedic Surgery", "ru": "Ортопедическая хирургия", "tm": "Ortopedik hirurgiýa"}, {"ar": "إعادة استبدال المفاصل", "en": "Revision Arthroplasty", "ru": "Ревизионное эндопротезирование", "tm": "Gaýtadan bogun çalyşmak"}, {"ar": "الجراحة بالروبوت والذكاء الاصطناعي والملاحة الحاسوبية", "en": "Robotic AI & Computer Navigated Surgery", "ru": "Роботизированная хирургия с ИИ и компьютерной навигацией", "tm": "Robot, emeli aň we kompýuter nawigasiýaly hirurgiýa"}, {"ar": "إصابات الملاعب والكسور", "en": "Sports Injuries & Trauma", "ru": "Спортивные травмы и травматология", "tm": "Sport şikesleri we trawmatologiýa"}], "profile": [{"ar": "الدكتور هيمانت شارما جراح عظام ذو خبرة عالية تمتد لأكثر من 30 سنة من العمل السريري في الهند والمملكة المتحدة. متخصص في جراحة استبدال الورك والركبة والكتف، بما فيها عمليات إعادة الاستبدال المعقدة. وتشمل خبرته أيضاً إصابات الملاعب في الكتف وباقي المفاصل وعلاج الكسور والإصابات المعقدة، وهو خبير في الجراحة بمساعدة الروبوت والذكاء الاصطناعي والملاحة الحاسوبية، بتقنيات متقدمة لدقة أعلى وتعافٍ أسرع.", "en": "Dr. Hemant Sharma is a highly experienced Orthopaedic Surgeon with over 30 years of clinical experience across India and the United Kingdom. Dr. Sharma is a specialist in hip, knee and shoulder replacement surgery, including complex revision surgeries. His expertise also includes sports injuries of the shoulder and other joints, and complex trauma management. He is also an expert in robotics AI assisted, and computer-navigated surgeries using advanced technology for greater precision and faster recovery.", "ru": "Д-р Хемант Шарма — опытный хирург-ортопед с более чем 30-летним клиническим стажем в Индии и Великобритании. Специализируется на эндопротезировании тазобедренного, коленного и плечевого суставов, включая сложные ревизионные операции. Также занимается спортивными травмами плеча и других суставов и лечением сложных травм. Эксперт в роботизированной хирургии с ИИ и компьютерной навигацией — для большей точности и более быстрого восстановления.", "tm": "Dr. Hemant Şarma Hindistanda we Beýik Britaniýada 30 ýyldan gowrak kliniki tejribesi bolan tejribeli ortoped hirurgdyr. But, dyz we egin bogunlaryny çalyşmak, şol sanda çylşyrymly gaýtadan operasiýalar boýunça hünärmen. Egniň we beýleki bogunlaryň sport şikeslerini we çylşyrymly şikesleri hem bejerýär. Has ýokary takyklyk we çalt gutulmak üçin robot, emeli aň we kompýuter nawigasiýaly hirurgiýanyň hünärmenidir."}, {"ar": "وتشمل خبرته أيضاً الطب التجديدي: البلازما الغنية بالصفائح (PRP) ومركّز نخاع العظم (BMAC) والعلاجات الخلوية لالتهاب المفاصل وإصابات الأوتار والأربطة، والتعزيز البيولوجي لالتئام الغضروف والغضروف الهلالي والأربطة والكفة المدوّرة، وحقن تزييت المفصل، والعلاجات غير الجراحية لتخفيف الألم وتأخير استبدال المفصل.", "en": "Dr. Hemant’s areas of expertise also include regenerative medicine, including PRP, BMAC and cell-based therapies for arthritis, tendon and ligament injuries, biologic augmentation for cartilage, meniscus, ligament and rotator cuff healing, visco-supplementation, and non-surgical treatments to relieve pain and delay joint replacement.", "ru": "Также в сферу его компетенций входит регенеративная медицина: PRP, BMAC и клеточная терапия при артрите, травмах сухожилий и связок, биологическая поддержка заживления хряща, мениска, связок и вращательной манжеты, вискосапплементация и нехирургическое лечение для облегчения боли и отсрочки эндопротезирования.", "tm": "Onuň hünär ugurlaryna regeneratiw lukmançylyk hem degişli: artrit, sinir we baglaýjy şikesleri üçin PRP, BMAC we öýjük bejergisi, kitirdewüg, menisk, baglaýjylar we aýlanma manžetiniň bitişmegi üçin biologik goldaw, wiskosuplementasiýa we agyryny aýyrmak hem-de bogun çalyşmagy yza süýşürmek üçin operasiýasyz bejergiler."}, {"ar": "تلقّى تدريباً متقدماً في إعادة استبدال المفاصل واستبدال مفاصل الطرف السفلي في المملكة المتحدة، ولديه خبرة واسعة في علاج حالات الورك والركبة المعقدة. يركّز في عمله على الدقة والتقنيات طفيفة التوغل والتعافي المبكر واستعادة الحركة، مع إعطاء الأولوية لسلامة المريض والنتائج طويلة الأمد.", "en": "He has undergone advanced training in revision and lower-limb arthroplasty in the United Kingdom and has extensive experience in managing complex hip and knee conditions. His clinical approach focuses on precision, minimally invasive techniques, early recovery, and restoring mobility while prioritising patient safety and long-term outcomes.", "ru": "Он прошёл углублённую подготовку по ревизионному эндопротезированию и эндопротезированию нижних конечностей в Великобритании и имеет большой опыт лечения сложных патологий тазобедренного и коленного суставов. В работе делает упор на точность, малоинвазивные методы, раннее восстановление и возвращение подвижности, ставя на первое место безопасность пациента и долгосрочный результат.", "tm": "Ol Beýik Britaniýada gaýtadan we aşaky aýak bogunlaryny çalyşmak boýunça ýokary taýýarlyk geçdi we çylşyrymly but hem-de dyz ýagdaýlaryny bejermekde giň tejribesi bar. Onuň işinde takyklyk, az inwaziw usullar, irki gutulmak we hereketi dikeltmek esasy orunda durýar, näsagyň howpsuzlygy we uzak möhletli netijeler bolsa ileri tutulýar."}, {"ar": "يشارك بفاعلية في التعليم الجراحي والبحث العلمي والإشراف والممارسة القائمة على الدليل، وله أبحاث منشورة في مجلات محكّمة ويُدعى محاضراً في مؤتمرات وطنية ودولية.", "en": "He is actively involved in surgical education, research, mentorship, and evidence-based orthopaedic practice. His academic contributions include peer-reviewed publications and participation as invited faculty at national and international conferences.", "ru": "Активно занимается хирургическим обучением, исследованиями, наставничеством и доказательной ортопедией. Автор рецензируемых публикаций, приглашённый лектор национальных и международных конференций.", "tm": "Ol hirurgiki bilim bermekde, ylmy barlaglarda, halypaçylykda we subutnamalara esaslanýan ortopediýada işjeň. Synlanylan žurnallarda neşirleri bar we milli hem-de halkara maslahatlarda çagyrylan mugallym hökmünde çykyş edýär."}, {"ar": "والدكتور هيمانت شارما متحدث في TEDx أيضاً، يشارك معرفته ورؤيته في الرعاية الصحية وجراحة العظام ورعاية المرضى.", "en": "Dr. Hemant Sharma is also a TEDx Speaker, sharing knowledge and perspectives related to healthcare, orthopaedics, and pa "Gurugram"}}, {"key": "hitesh", "filter": "spine", "icon": "activity", "img": "img/dr-hitesh.webp", "exp": 19, "name": {"ar": "د. هيتيش غارغ", "en": "Dr. Hitesh Garg", "ru": "Д-р Хитеш Гарг", "tm": "Dr. Hiteş Garg"}, "title": {"ar": "رئيس قسم جراحة العمود الفقري", "en": "Head – Ortho Spine Surgery", "ru": "Руководитель отделения хирургии позвоночника", "tm": "Onurga hirurgiýasy bölüminiň ýolbaşçysy"}, "spec": {"ar": "جراح العمود الفقري والجنف", "en": "Spine & scoliosis surgeon", "ru": "Хирург позвоночника и сколиоза", "tm": "Onurga we skolioz hirurgy"}, "area": {"ar": "العمود الفقري", "en": "Spine", "ru": "Позвоночник", "tm": "Onurga"}, "big": {"ar": "الفقرات", "en": "SPINE", "ru": "СПИНА", "tm": "ONURGA"}, "card": {"ar": "أكثر من 5000 عملية عمود فقري، تدرّب في جامعة ييل الأمريكية، وعالج مرضى من أكثر من 50 دولة.", "en": "5,000+ spine surgeries, trained at Yale University (USA), patients from 50+ countries.", "ru": "Более 5000 операций на позвоночнике, стажировка в Йельском университете (США), пациенты из 50+ стран.", "tm": "5000-den gowrak onurga operasiýasy, Ýel uniwersitetinde (ABŞ) taýýarlanan, 50-den gowrak ýurtdan näsaglar."}, "langs": {"ar": "الإنكليزية، الهندية، البنجابية", "en": "English, Hindi, Punjabi", "ru": "английский, хинди, панджаби", "tm": "iňlis, hindi, penjabi"}, "specialties": [{"ar": "جراحة العظام", "en": "Orthopaedic Surgery", "ru": "Ортопедическая хирургия", "tm": "Ortopedik hirurgiýa"}, {"ar": "جراحة الجنف", "en": "Scoliosis Surgery", "ru": "Хирургия сколиоза", "tm": "Skolioz hirurgiýasy"}, {"ar": "جراحة العمود الفقري", "en": "Spine Surgery", "ru": "Хирургия позвоночника", "tm": "Onurga hirurgiýasy"}], "profile": [{"ar": "الدكتور هيتيش غارغ رئيس وحدة جراحة العمود الفقري في مستشفى أرتميس، غورغاون، الهند. يمتلك خبرة غنية تزيد على 15 سنة في جراحة العمود الفقري، وعمل في مؤسسات رائدة حول العالم مثل جامعة ييل ومستشفى شراينرز للأطفال في فيلادلفيا بالولايات المتحدة. تخرّج من معهد AIIMS في نيودلهي، أعلى كلية طب في الهند، وأكمل دراساته العليا في مستشفى KEM العريق في مومباي. ورغم عرض منصب أكاديمي عليه في أمريكا، اختار العودة إلى الهند ليؤسس مركزاً متقدماً للعمود الفقري بمستوى عالمي. له اهتمام أكاديمي كبير، ونشر أبحاثاً محلية ودولية، وكتب فصولاً في مراجع عالمية لجراحة العمود الفقري.", "en": "Dr Hitesh Garg is the head of Ortho-Spine surgery unit at Artemis hospital, Gurgaon, India. He has a rich experience of more than 15 years in spine surgery and has worked at many apex institutes around the globe like Yale University (USA), Shriners Hospital for Children, Philadelphia (USA). He has done his graduation from AIIMS, New Delhi (top most college of India) and post graduation from prestigious KEM Hospital, Mumbai. In spite of being offered a faculty position in USA, he chose to come back to India with the aim to establish an advanced spine center of international repute in India. He has strong academic interest, has published nationally and internationally and has written chapters in world renowned books on spine surgery.", "ru": "Д-р Хитеш Гарг — руководитель отделения хирургии позвоночника больницы Artemis в Гургаоне, Индия. Более 15 лет опыта в хирургии позвоночника; работал в ведущих учреждениях мира — Йельском университете и Детской больнице Шрайнерс в Филадельфии (США). Окончил AIIMS в Нью-Дели — лучший медицинский вуз Индии, — ординатуру прошёл в престижной больнице KEM в Мумбаи. Несмотря на предложение преподавать в США, вернулся в Индию, чтобы создать передовой спинальный центр международного уровня. Активно занимается наукой, публикуется в Индии и за рубежом, автор глав в известных мировых руководствах по хирургии позвоночника.", "tm": "Dr. Hiteş Garg Hindistanyň Gurgaon şäherindäki Artemis hassahanasynyň onurga hirurgiýasy bölüminiň ýolbaşçysydyr. Onurga hirurgiýasynda 15 ýyldan gowrak baý tejribesi bar we Ýel uniwersiteti, Filadelfiýadaky Şraýners çagalar hassahanasy (ABŞ) ýaly dünýäniň öňdebaryjy edaralarynda işledi. Hindistanyň iň gowy lukmançylyk ýokary okuw mekdebi bolan Täze Delidäki AIIMS-i, aspiranturany bolsa Mumbaýdaky abraýly KEM hassahanasyny tamamlady. ABŞ-da mugallymçylyk wezipesi hödürlenendigine garamazdan, halkara derejeli öňdebaryjy onurga merkezini döretmek maksady bilen Hindistana gaýdyp geldi. Ylma uly gyzyklanmasy bar, ýurtda we daşary ýurtlarda neşir edildi we dünýä belli onurga hirurgiýasy kitaplarynda bapdar ýazdy."}, {"ar": "أجرى أكثر من 5000 عملية في العمود الفقري، منها أكثر من 2500 عملية دمج فقرات (TLIF وACDF وغيرها)، و1000 عملية تصحيح تشوّهات (الجنف والحداب)، و300 عملية استبدال قرص صناعي في الرقبة وأسفل الظهر، و500 علاج كسور، و500 عملية معقدة أخرى مثل أورام العمود الفقري والعيوب الخلقية وتثبيت العمود الفقري بالحوض.", "en": "He has more than 5000 spine surgeries to his credit including more than 2500 spinal fusions (TLIF, ACDF etc), 1000 deformity correction procedures (Scoliosis and kyphosis), 300 lumbar and cervical artificial disc replacements, 500 fracture treatments and 500 other complex surgeries like spinal tumour, congenital defects and spino-pelvic fixations.", "ru": "На его счету более 5000 операций на позвоночнике: более 2500 спондилодезов (TLIF, ACDF и др.), 1000 коррекций деформаций (сколиоз и кифоз), 300 замен межпозвонковых дисков в шейном и поясничном отделах, 500 операций при переломах и 500 других сложных вмешательств — при опухолях позвоночника, врождённых пороках и пояснично-тазовой фиксации.", "tm": "Onuň 5000-den gowrak onurga operasiýasy bar: 2500-den gowrak onurga birikdirme (TLIF, ACDF we ş.m.), 1000 deformasiýany düzetmek (skolioz we kifoz), boýun we bil bölüminde 300 emeli disk çalyşmak, 500 döwük bejergisi we onurga çişleri, dogabitdi kemçilikler we onurga-çanak berkitmesi ýaly 500 beýleki çylşyrymly operasiýa."}, {"ar": "يستخدم أحدث التقنيات أثناء الجراحة، مثل مراقبة الأعصاب وجهاز O-arm والملاحة الجراحية وغرف العمليات الحديثة والمجهر الجراحي، وهو ما يمنحه نسبة نجاح عالية تقارب 98%.", "en": "He uses the latest cutting edge technology during surgery such as Neuromonitoring, O-arm, Navigation, modular operation theaters and microscope which allows him to have a high success rate of almost 98 percent.", "ru": "Во время операций использует новейшие технологии — нейромониторинг, O-arm, навигацию, модульные операционные и микроскоп, — что обеспечивает высокий показатель успеха — почти 98%.", "tm": "Operasiýa wagtynda neýromonitoring, O-arm, nawigasiýa, döwrebap operasiýa otaglary we mikroskop ýaly iň täze tehnologiýalary ulanýar, bu bolsa oňa takmynan 98 göterim ýokary üstünlik derejesini üpjün edýär."}, {"ar": "أجرى عمليات لمرضى من أكثر من 50 دولة، منها العراق والسعودية وعُمان وتركمانستان وأوزبكستان وطاجيكستان وكازاخستان وأفغانستان والولايات المتحدة وكندا وأستراليا وألمانيا والسودان وجنوب السودان وكينيا ونيجيريا وزيمبابوي ومالاوي وإثيوبيا وأوغندا ونيبال وبنغلاديش، إضافة إلى الهند. ومن مرضاه شخصيات بارزة محلياً ودولياً، من ضباط ووزراء ومشاهير ورياضيين وأطباء ورجال أعمال. ويهتم بشكل خاص بجراحات العمود الفقري طفيفة التوغل، والجراحات التي تحافظ على حركة العمود الفقري، وجراحات الرقبة ومفصل الجمجمة بالفقرات، وعمليات تصحيح الجنف والحداب.", "en": "Dr. Hitesh Garg has operated on patients from more than 50 countries including USA, Canada, Australia, Germany, Iraq, Saudi Arabia, Oman, Sudan, South Sudan, Kenya, Nigeria, Zimbabwe, Malawi, Ethiopia, Uzbekistan, Tajikistan, Kazakhstan, Uganda, Turkmenistan, Afghanistan, Nepal and Bangladesh besides India. His clientele includes some very prominent national and international personalities including army officers, ministers, celebrities, sportspersons playing at national and international level, doctors and businessmen. His special interest includes minimally invasive spine surgeries, motion preserving spine surgeries, cranio-vertebral and cervical spine surgeries and deformity correction procedures for scoliosis and kyphosis.", "ru": "Д-р Хитеш Гарг оперировал пациентов из более чем 50 стран — США, Канады, Австралии, Германии, Ирака, Саудовской Аравии, Омана, Судана, Южного Судана, Кении, Нигерии, Зимбабве, Малави, Эфиопии, Узбекистана, Таджикистана, Казахстана, Уганды, Туркменистана, Афганистана, Непала и Бангладеш, не считая Индии. Среди его пациентов — известные в стране и мире люди: военные, министры, знаменитости, спортсмены национального и международного уровня, врачи и бизнесмены. Особый интерес — малоинвазивная хирургия позвоночника, операции с сохранением подвижности, краниовертебральная и шейная хирургия, коррекция сколиоза и кифоза.", "tm": "Dr. Hiteş Garg Hindistandan başga-da ABŞ, Kanada, Awstraliýa, Germaniýa, Yrak, Saud Arabystany, Oman, Sudan, Günorta Sudan, Keniýa, Nigeriýa, Zimbabwe, Malawi, Efiopiýa, Özbegistan, Täjigistan, Gazagystan, Uganda, Türkmenistan, Owganystan, Nepal we Bangladeş ýaly 50-den gowrak ýurtdan gelen näsaglara operasiýa etdi. Onuň näsaglarynyň arasynda harby serkerdeler, ministrler, meşhur adamlar, milli we halkara derejedäki türgenler, lukmanlar we telekeçiler ýaly tanymal şahslar bar. Ol esasan az inwaziw onurga operasiýalaryna, hereketi saklaýan operasiýalara, kelle-onurga we boýun onurgasynyň operasiýalaryna hem-de skolioz we kifozy düzetmäge aýratyn üns berýär."}, {"ar": "يؤمن الدكتور غارغ بتلبية احتياجات كل مريض من خلال تقييم شامل وعلاج مصمم ليساعده على حياة نشطة خالية من الألم، ويجمع بين أحدث التقنيات والأساليب التقليدية المثبتة ليقدّم أفضل رعاية ممكنة.", "en": "Dr. Garg believes in meeting patients’ individual needs through comprehensive evaluation and treatment designed to help them achieve active, pain-free lifestyles. He combines leading edge techniques with proven traditional methods to provide patients with the best care possible.", "ru": "Д-р Гарг стремится учитывать индивидуальные потребности каждого пациента — через всестороннее обследование и лечение, которое помогает вернуться к активной жизни без боли. Он сочетает передовые методы с проверенными традиционными, чтобы обеспечить наилучшую помощь.", "tm": "Dr. Garg her näsagyň aýratyn isleglerini giňişleýin barlag we agyrysyz, işjeň durmuşa dolanmaga kömek edýän bejergi arkaly kanagatlandyrmagy maksa bbon", "img": "img/dr-vinay.webp", "exp": 20, "name": {"ar": "د. فيناي صموئيل غايكواد", "en": "Dr. Vinay Samuel Gaikwad", "ru": "Д-р Винай Сэмюэл Гайквад", "tm": "Dr. Winaý Samuel Gaýkwad"}, "title": {"ar": "رئيس قسم جراحة الأورام وجراحة الجهاز الهضمي", "en": "Chairperson – Surgical Oncology & GI Surgery", "ru": "Руководитель отделения хирургической онкологии и хирургии ЖКТ", "tm": "Hirurgiki onkologiýa we aşgazan-içege hirurgiýasy bölüminiň ýolbaşçysy"}, "spec": {"ar": "جراح أورام الجهاز الهضمي والكبد والبنكرياس", "en": "GI & HPB surgical oncologist", "ru": "Хирург-онколог ЖКТ, печени и поджелудочной железы", "tm": "Aşgazan-içege, bagyr we aşgazanasty mäzi onkohirurgy"}, "area": {"ar": "جراحة الأورام", "en": "Surgical oncology", "ru": "Хирургическая онкология", "tm": "Hirurgiki onkologiýa"}, "big": {"ar": "الأورام", "en": "ONCO", "ru": "ОНКО", "tm": "ONKO"}, "card": {"ar": "أكثر من 20 سنة في جراحة الأورام المعقدة بالروبوت والمنظار، تدرّب في تاتا التذكاري وميموريال سلون كيترينغ.", "en": "20+ years in complex robotic & laparoscopic cancer surgery; trained at Tata Memorial and Memorial Sloan Kettering.", "ru": "Более 20 лет сложной роботической и лапароскопической онкохирургии; стажировался в Tata Memorial и Memorial Sloan Kettering.", "tm": "Robot we laparoskopik onkohirurgiýada 20 ýyldan gowrak tejribe; Tata Memorial we Memorial Sloan Kettering-de taýýarlandy."}, "langs": {"ar": "الإنكليزية، الهندية", "en": "English, Hindi", "ru": "английский, хинди", "tm": "iňlis, hindi"}, "specialties": [{"ar": "علاج الأورام", "en": "Oncology", "ru": "Онкология", "tm": "Onkologiýa"}, {"ar": "جراحة الأورام", "en": "Surgical Oncology", "ru": "Хирургическая онкология", "tm": "Hirurgiki onkologiýa"}, {"ar": "أورام الجهاز الهضمي", "en": "GI Oncology", "ru": "Онкология ЖКТ", "tm": "Aşgazan-içege onkologiýasy"}], "profile": [{"ar": "الدكتور فيناي صموئيل غايكواد جرّاح أورام ذو خبرة تزيد على 20 سنة في العلاج الجراحي للسرطانات المعقدة والمتقدمة. يتخصص في جراحة أورام الجهاز الهضمي والكبد والبنكرياس والقنوات الصفراوية (HPB)، وفي أورام سطح الصفاق (الغشاء البريتوني)، ولديه خبرة واسعة في جراحات السرطان بالروبوت والمنظار والجراحات طفيفة التوغل.", "en": "Dr. Vinay Samuel Gaikwad is an experienced Surgical Oncologist with over 20 years of expertise in the surgical management of complex and advanced cancers. He specialises in Gastrointestinal (GI) and Hepatopancreatobiliary (HPB) Surgical Oncology, as well as peritoneal surface malignancies, with extensive experience in robotic, laparoscopic and minimally invasive cancer surgeries.", "ru": "Д-р Винай Сэмюэл Гайквад — опытный хирург-онколог с более чем 20-летним стажем хирургического лечения сложных и запущенных форм рака. Специализируется на хирургической онкологии ЖКТ и гепатопанкреатобилиарной зоны (HPB), а также на опухолях брюшины; имеет большой опыт роботических, лапароскопических и малоинвазивных онкологических операций.", "tm": "Dr. Winaý Samuel Gaýkwad çylşyrymly we ösen rak keselleriniň hirurgiki bejergisinde 20 ýyldan gowrak tejribeli onkohirurgdyr. Ol aşgazan-içege (GI) we bagyr-aşgazanasty mäzi-öt ýollary (HPB) onkohirurgiýasy hem-de garyn pärdesiniň ýaman çişleri boýunça ýöriteleşýär; robot, laparoskopik we az inwaziw onkologiki operasiýalarda giň tejribesi bar."}, {"ar": "تشمل خبرته السريرية العلاج الجراحي لسرطانات الكبد والبنكرياس والمعدة والمريء والقولون والمستقيم، إضافة إلى الإجراءات المتقدمة لأورام سطح الصفاق. تلقّى تدريباً متخصصاً في أبرز مراكز السرطان، منها مستشفى تاتا التذكاري في مومباي ومركز ميموريال سلون كيترينغ للسرطان في نيويورك.", "en": "His clinical expertise includes the surgical treatment of cancers affecting the liver, pancreas, stomach, oesophagus and colorectal region, along with advanced procedures for peritoneal surface malignancies. He has received specialised training at leading cancer institutions, including Tata Memorial Hospital, Mumbai, and Memorial Sloan Kettering Cancer Center, New York.", "ru": "Его клиническая практика включает хирургическое лечение рака печени, поджелудочной железы, желудка, пищевода и колоректальной области, а также сложные вмешательства при опухолях брюшины. Он прошёл специализированную подготовку в ведущих онкоцентрах, включая Tata Memorial Hospital (Мумбаи) и Memorial Sloan Kettering Cancer Center (Нью-Йорк).", "tm": "Onuň kliniki tejribesi bagyr, aşgazanasty mäzi, aşgazan, gyzylöňeç we ýogyn-göni içege rak keselleriniň hirurgiki bejergisini, şeýle hem garyn pärdesiniň çişleri boýunça ösen operasiýalary öz içine alýar. Ol Mumbaýdaky Tata Memorial hassahanasy we Nýu-Ýorkdaky Memorial Sloan Kettering rak merkezi ýaly öňdebaryjy merkezlerde ýörite taýýarlyk geçdi."}, {"ar": "تدرّب الدكتور غايكواد على تقنيات العلاج المتقدمة مثل HIPEC (العلاج الكيميائي الحراري داخل الصفاق) وPIPAC (العلاج الكيميائي بالرذاذ المضغوط داخل الصفاق)، المستخدمة لمرضى مختارين بسرطانات تصيب بطانة البطن. ولديه أيضاً خبرة في العلاج الكيميائي بمضخة التسريب عبر الشريان الكبدي.", "en": "Dr. Gaikwad is trained in advanced treatment techniques such as HIPEC (Hyperthermic Intraperitoneal Chemotherapy) and PIPAC (Pressurised Intraperitoneal Aerosolised Chemotherapy), used in the management of selected patients with cancers involving the abdominal lining. He also has expertise in Hepatic Artery Infusion Pump Chemotherapy.", "ru": "Д-р Гайквад владеет передовыми методами лечения, такими как HIPEC (гипертермическая внутрибрюшинная химиотерапия) и PIPAC (аэрозольная внутрибрюшинная химиотерапия под давлением), применяемыми у отдельных пациентов с поражением брюшины. Также имеет опыт химиотерапии через инфузионную помпу в печёночной артерии.", "tm": "Dr. Gaýkwad garyn pärdesine ýaýran rak keselli saýlanan näsaglarda ulanylýan HIPEC (gyzgyn garyn içi himioterapiýa) we PIPAC (basyş astynda aerozol görnüşli garyn içi himioterapiýa) ýaly ösen usullar boýunça taýýarlandy. Şeýle hem bagyr arteriýasy arkaly infuzion nasos bilen himioterapiýada tejribesi bar."}, {"ar": "إلى جانب عمله السريري، أسهم في البحث الطبي بأبحاث منشورة في مجلات وطنية ودولية. يجمع نهجه بين الدقة الجراحية والعلاج المبني على الأدلة والتواصل الواضح، ليساعد المرضى على فهم خيارات علاجهم واتخاذ قرارات مدروسة.", "en": "Alongside his clinical practice, he has contributed to medical research through publications in national and international journals. His approach combines surgical precision, evidence-based treatment and clear communication, helping patients understand their treatment options and make informed decisions.", "ru": "Наряду с клинической практикой он ведёт научную работу и публикуется в национальных и международных журналах. Его подход сочетает хирургическую точность, доказательное лечение и понятное общение, помогая пациентам разобраться в вариантах лечения и принять взвешенное решение.", "tm": "Kliniki işi bilen bir hatarda, ol milli we halkara žurnallarda çap edilen işleri bilen lukmançylyk ylmyna goşant goşdy. Onuň çemeleşmesi hirurgiki takyklygy, subutnamalara esaslanýan bejergini we düşnükli gürrüňdeşligi birleşdirip, näsaglara bejergi mümkinçiliklerine düşünmäge we ölçerip karar bermäge kömek edýär."}], "qualifications": [{"ar": "بكالوريوس الطب والجراحة (MBBS) — كلية الطب المسيحية، لوديانا (2000)", "en": "MBBS – Christian Medical College (2000), Ludhiana", "ru": "MBBS — Христианский медицинский колледж, Лудхиана (2000)", "tm": "MBBS — Hristian lukmançylyk kolleji, Ludhiana (2000)"}, {"ar": "ماجستير الجراحة العامة (MS) — كلية الطب المسيحية، لوديانا (2006)", "en": "MS (General Surgery) – Christian Medical College (2006), Ludhiana", "ru": "MS (общая хирургия) — Христианский медицинский колледж, Лудхиана (2006)", "tm": "MS (umumy hirurgiýa) — Hristian lukmançylyk kolleji, Ludhiana (2006)"}, {"ar": "زميل جمعية الجراحين في الهند (FAIS)", "en": "FAIS – Fellow, Association of Surgeons of India", "ru": "FAIS — член Ассоциации хирургов Индии", "tm": "FAIS — Hindistanyň hirurglar assosiasiýasynyň agzasy"}, {"ar": "زميل جمعية جراحي التدخل المحدود في الهند (FMAS)", "en": "FMAS – Fellow, Association of Minimal Access Surgeons of India", "ru": "FMAS — kary töwekgelçilikli göwrelilik"}, "area": {"ar": "النسائية والتوليد", "en": "Obstetrics & gynaecology", "ru": "Акушерство и гинекология", "tm": "Akuşerçilik we ginekologiýa"}, "big": {"ar": "النسائية", "en": "GYNAE", "ru": "ГИНЕКО", "tm": "AÝAL"}, "card": {"ar": "من أشهر أطباء النساء والتوليد في دلهي، بخبرة تزيد على 25 سنة في الحمل عالي الخطورة وجراحات المنظار والروبوت.", "en": "One of Delhi NCR’s best-known obstetricians & gynaecologists, 25+ years in high-risk pregnancy, laparoscopic and robotic surgery.", "ru": "Один из самых известных акушеров-гинекологов Дели, более 25 лет опыта: беременность высокого риска, лапароскопия, роботическая хирургия.", "tm": "Deliniň iň meşhur akuşer-ginekologlarynyň biri; ýokary töwekgelçilikli göwrelilikde, laparoskopik we robot hirurgiýasynda 25 ýyldan gowrak tejribe."}, "langs": {"ar": "الإنكليزية، الهندية، الكشميرية، البنجابية، الأردية", "en": "English, Hindi, Kashmiri, Punjabi, Urdu", "ru": "английский, хинди, кашмири, панджаби, урду", "tm": "iňlis, hindi, kaşmir, penjap, urdu"}, "specialties": [{"ar": "الأمومة والولادة", "en": "Maternity", "ru": "Материнство и роды", "tm": "Enelik we çaga dogurmak"}, {"ar": "التوليد", "en": "Obstetrics", "ru": "Акушерство", "tm": "Akuşerçilik"}, {"ar": "أمراض النساء", "en": "Gynaecology", "ru": "Гинекология", "tm": "Ginekologiýa"}], "profile": [{"ar": "الدكتورة رينو راينا سهغال من أشهر أطباء النساء والتوليد في دلهي والعاصمة الوطنية، بخبرة واسعة تزيد على 25 سنة. تشغل حالياً منصب رئيسة قسم أمراض النساء والتوليد في مستشفيات أرتميس ودافوديلز في غورغاون، وكانت قبل ذلك في مستشفى ماكس سوبر سبيشاليتي في ساكيت ومستشفى سير غانغا رام في نيودلهي.", "en": "Dr. Renu Raina Sehgal is amongst the most well-known Obstetricians and Gynaecologists of Delhi NCR with over 25 years of extensive experience. She is currently the Chairperson, Department of Obstetrics & Gynaecology at Artemis and Daffodils Hospitals, Gurgaon. Prior to joining Artemis she was associated with Max Super Speciality Hospital, Saket, New Delhi and Sir Ganga Ram Hospital, New Delhi.", "ru": "Д-р Рену Райна Сехгал — один из самых известных акушеров-гинекологов столичного региона Дели с опытом более 25 лет. Сейчас она возглавляет отделение акушерства и гинекологии больниц Artemis и Daffodils в Гургаоне. До Artemis работала в Max Super Speciality Hospital (Сакет, Нью-Дели) и в больнице Sir Ganga Ram (Нью-Дели).", "tm": "Dr. Renu Raýna Sehgal 25 ýyldan gowrak giň tejribesi bolan, Deli paýtagt sebitiniň iň meşhur akuşer-ginekologlarynyň biridir. Häzir ol Gurgaondaky Artemis we Daffodils hassahanalarynyň akuşerçilik we ginekologiýa bölüminiň ýolbaşçysy. Artemisden öň Nýu-Delidäki Max Super Speciality (Saket) we Sir Ganga Ram hassahanalarynda işledi."}, {"ar": "تتمتع الدكتورة سهغال بخبرة كبيرة في رعاية الحمل عالي الخطورة، وتجري بشكل روتيني جراحات المنظار الكبرى والصغرى وتنظير الرحم والجراحات الروبوتية. وهي مشرفة ومدرّسة معتمدة لطلاب الدراسات العليا في أمراض النساء والتوليد.", "en": "Dr. Sehgal is highly experienced in handling High Risk Obstetrics and routinely caters to major and minor laparoscopic, hysteroscopic and robotic surgeries. She is a board-certified guide and teacher for postgraduate Obstetrics & Gynaecology students.", "ru": "Д-р Сехгал имеет большой опыт ведения беременности высокого риска и регулярно выполняет большие и малые лапароскопические, гистероскопические и роботические операции. Она аттестованный руководитель и преподаватель для ординаторов по акушерству и гинекологии.", "tm": "Dr. Sehgal ýokary töwekgelçilikli göwreliligi alyp barmakda uly tejribä eýe we yzygiderli uly we kiçi laparoskopik, gisteroskopik hem-de robot operasiýalaryny geçirýär. Ol akuşerçilik we ginekologiýa boýunça aspirantlar üçin tassyklanan ýolbaşçy we mugallymdyr."}, {"ar": "شاركت في مبادرات اعتماد الجودة للمستشفيات (NABH/JCI) وهي خبيرة في القضايا الطبية القانونية. دُعيت محاضِرةً ومتحدثةً في مؤتمرات وورش عمل وندوات عديدة، ولها مقالات وعروض وأبحاث كثيرة منشورة في مجلات مفهرسة.", "en": "She has been associated with quality accreditation initiatives (NABH/JCI) of hospitals and is an expert on medico-legal issues. She has been invited as faculty and speaker to various conferences, workshops and seminars, and is credited with numerous articles, presentations and publications in indexed journals.", "ru": "Она участвовала в программах аккредитации качества больниц (NABH/JCI) и является экспертом по медико-правовым вопросам. Приглашается лектором и докладчиком на конференции, мастер-классы и семинары; автор многочисленных статей, докладов и публикаций в индексируемых журналах.", "tm": "Ol hassahanalaryň hil akkreditasiýa (NABH/JCI) başlangyçlaryna gatnaşdy we lukmançylyk-hukuk meseleleri boýunça hünärmendir. Köp konferensiýalara, okuw maslahatlaryna we seminarlara mugallym we çykyş ediji hökmünde çagyryldy; indeksli žurnallarda köp makalalaryň, çykyşlaryň we neşirleriň awtorydyr."}], "qualifications": [{"ar": "بكالوريوس الطب والجراحة (MBBS) — كلية رافيندرا ناث طاغور الطبية، أودايبور، جامعة راجستان، جايبور", "en": "MBBS – Ravindra Nath Tagore Medical College, Udaipur, Rajasthan University, Jaipur", "ru": "MBBS — Медицинский колледж Равиндраната Тагора, Удайпур, Университет Раджастхана", "tm": "MBBS — Rawindranat Tagor lukmançylyk kolleji, Udaýpur, Rajastan uniwersiteti"}, {"ar": "الدراسات العليا (DNB) في أمراض النساء والتوليد — مستشفى سير غانغا رام، نيودلهي", "en": "Postgraduation (DNB) in Obstetrics & Gynaecology – Sir Ganga Ram Hospital, New Delhi", "ru": "Ординатура (DNB) по акушерству и гинекологии — больница Sir Ganga Ram, Нью-Дели", "tm": "Akuşerçilik we ginekologiýa boýunça aspirantura (DNB) — Sir Ganga Ram hassahanasy, Nýu-Deli"}, {"ar": "عضوية الأكاديمية الوطنية للعلوم الطبية (MNAMS)، نيودلهي", "en": "Membership of National Academy of Medical Sciences (MNAMS), New Delhi", "ru": "Член Национальной академии медицинских наук (MNAMS), Нью-Дели", "tm": "Milli lukmançylyk ylymlary akademiýasynyň agzasy (MNAMS), Nýu-Deli"}, {"ar": "زمالة جراحة المناظير النسائية المتقدمة — كوشين، كيرا идов неврологических расстройств с особым интересом к эпилепсии.", "tm": "Dr. Wiwek Barun Artemis hassahanasynyň newrologiýa bölüminiň uly maslahatçysy (newrologiýa we epilepsiýa). Ozal Deliniň Rohini etrabyndaky Shree Aggarsain halkara hassahanasynda, Telanganadaky Warangalda Shree Gomati we Lalita hassahanalarynda newrolog-maslahatçy, Deliniň Shalimar Bagh etrabyndaky Fortis hassahanasynda bolsa assosirlenen maslahatçy bolup işledi. Ähli görnüşli nerw keselleriniň bejergisinde uly tejribesi bar we aýratyn hem epilepsiýa bilen gyzyklanýar."}, {"ar": "بعد إتمام الدكتوراه التخصصية في الأعصاب، أمضى سنة زمالة ما بعد الدكتوراه في الصرع في معهد نظام للعلوم الطبية المرموق في حيدر آباد، حيث تلقّى تدريباً متقدماً على علاج حالات الصرع الصعبة عند الأطفال والكبار، بما يشمل العلاج الدوائي والجراحي، وتحفيز العصب المبهم (VNS)، والتحفيز الدماغي العميق (DBS)، والأقطاب تحت الجافية، وتخطيط الدماغ المجسّم (SEEG)، وتخطيط قشرة الدماغ (ECoG)، وتركيب الأقطاب الوتدية، والمراقبة الطويلة بالفيديو وتخطيط الدماغ. وهو مهتم بالجانب الأكاديمي ويشارك بانتظام محاضراً في منتديات وطنية ودولية.", "en": "After finishing DM Neurology he did one year of postdoctoral fellowship in epilepsy at the prestigious Nizam’s Institute of Medical Sciences, Hyderabad, where he received advanced training in managing difficult-to-treat epilepsy in children and adults, involving medical and surgical management, VNS, DBS, subdural grids, stereo-EEG, ECoG, placement of sphenoidal electrodes and long-term video-EEG monitoring. He is keenly interested in academics and regularly participates as faculty in national and international forums.", "ru": "После DM по неврологии он прошёл годичную постдокторскую стажировку по эпилепсии в престижном Nizam’s Institute of Medical Sciences (Хайдарабад), где получил углублённую подготовку по лечению трудно поддающейся терапии эпилепсии у детей и взрослых: медикаментозное и хирургическое лечение, VNS, DBS, субдуральные сетки, стерео-ЭЭГ, ЭКоГ, установка сфеноидальных электродов и длитель
